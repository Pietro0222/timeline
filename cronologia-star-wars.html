    ${aperto?contenutoPannelloFumetto(o):""}
  </div>`;
}

function voce(o, lato){
  const tipo = tipoGerarchico(o);
  const tipoLab = etichettaTipo(o);
  const sottotitolo = o.stagioni || o.dettaglio || "";
  const espandibile = ["romanzo","fumetto","manga","audiolibro"].includes(tipo);
  const haGuidaEpisodi = o.guidaEpisodi === "clone-wars";
  const haGuidaFumetto = tipo === "fumetto" && CONTENUTI_FUMETTI.has(o.ti);
  const guidaAperta = haGuidaEpisodi && guideEpisodiAperte.has(o.id);
  const fumettoAperto = haGuidaFumetto && guideFumettiAperte.has(o.id);
  const interattiva = haGuidaEpisodi || haGuidaFumetto;
  const tagTesta = interattiva ? "button" : "div";
  const idPannello = haGuidaEpisodi ? `guida-${o.id}` : `contenuti-${o.id}`;
  const ariaLabel = haGuidaEpisodi
    ? `${guidaAperta?"Chiudi":"Apri"} l'ordine cronologico degli episodi di The Clone Wars`
    : `${fumettoAperto?"Chiudi":"Apri"} i numeri contenuti in ${o.ti}`;
  const meta = [tipoLab, o.rl].concat(o.lg?["Legends"]:[]);
  const mostraImg = COPERTINE_ATTIVE && o.img;
  const src = mostraImg ? `<img data-shot data-src="immagini/${esc(o.img)}?v=${CACHE_BUST}" alt="" draggable="false" loading="eager" decoding="async">` : "";
  return `<li class="item ${lato} ${o.lg?"legends":""} ${schedeIngrandite.has(o.id)?"mobile-ingrandita":""} ${haGuidaEpisodi?"has-episode-guide":""} ${guidaAperta?"episode-guide-open":""} ${haGuidaFumetto?"has-comic-guide":""} ${fumettoAperto?"comic-guide-open":""}" id="opera-${o.id}" data-opera-tipo="${esc(tipo)}">
    <${tagTesta} class="head"${interattiva?` type="button" aria-expanded="${String(guidaAperta || fumettoAperto)}" aria-controls="${idPannello}" aria-label="${esc(ariaLabel)}"`:""}>
      <figure class="shot${mostraImg?"":" vuoto"}" data-tipo="${esc(tipoLab)}">${src}</figure>
      <span class="txt">
        <span class="yr">${esc(o.yl)}</span>
        <span class="title">${esc(o.ti)}</span>
        ${sottotitolo?`<span class="stagioni">${esc(sottotitolo)}</span>`:""}
        <span class="meta">${meta.map(m=>`<span>${esc(m)}</span>`).join("")}</span>
      </span>
      ${interattiva?'<span class="episode-expand" aria-hidden="true"></span>':""}
    </${tagTesta}>
    ${haGuidaEpisodi?pannelloCloneWars(o,guidaAperta):""}
    ${haGuidaFumetto?pannelloFumetto(o,fumettoAperto):""}
    ${espandibile?'<span class="mobile-expand" aria-hidden="true"></span>':""}
  </li>`;
}

/* Su mobile la trasformazione visiva deve ridurre anche lo spazio
   occupato nella colonna: altrimenti i riquadri sembrano piu' piccoli,
   ma la pagina resta lunga esattamente come prima. */
function aggiornaIngombroScheda(scheda){
  if(!scheda) return;
  if(!vistaMobile.matches){
    scheda.style.removeProperty("height");
    scheda.style.removeProperty("--scala-scheda-mobile");
    scheda.style.removeProperty("--altezza-testa-mobile");
    return;
  }
  const head = scheda.querySelector(".head");
  if(!head) return;
  const scala = scheda.classList.contains("mobile-ingrandita")
    ? SCALA_SCHEDA_INGRANDITA : SCALA_SCHEDA_CHIUSA;
  scheda.style.setProperty("--scala-scheda-mobile", scala);
  const altezzaTesta = Math.ceil(head.offsetHeight * scala);
  scheda.style.setProperty("--altezza-testa-mobile", altezzaTesta + "px");
  const pannelloFumetto = scheda.querySelector(":scope > .comic-guide .comic-guide-clip");
  const altezzaPannello = scheda.classList.contains("comic-guide-open") && pannelloFumetto
    ? pannelloFumetto.scrollHeight : 0;
  scheda.style.height = Math.ceil(altezzaTesta + altezzaPannello) + "px";
}

function aggiornaIngombriSchede(){
  const schede = [...document.querySelectorAll(SELETTORE_SCHEDE_MOBILI)];
  if(!vistaMobile.matches){
    schede.forEach(scheda=>{
      scheda.style.removeProperty("height");
      scheda.style.removeProperty("--scala-scheda-mobile");
      scheda.style.removeProperty("--altezza-testa-mobile");
    });
    return;
  }

  /* Prima tutte le scritture, poi tutte le letture e infine le altezze:
     evita un ricalcolo completo del layout per ognuna delle centinaia di
     schede presenti nella pagina. */
  const preparate = schede.map(scheda=>{
    const scala = scheda.classList.contains("mobile-ingrandita")
      ? SCALA_SCHEDA_INGRANDITA : SCALA_SCHEDA_CHIUSA;
    scheda.style.setProperty("--scala-scheda-mobile",scala);
    return {scheda,scala,head:scheda.querySelector(".head"),
      pannello:scheda.querySelector(":scope > .comic-guide .comic-guide-clip")};
  }).filter(x=>x.head);

  const misure = preparate.map(x=>({
    ...x,
    altezzaTesta:Math.ceil(x.head.offsetHeight*x.scala),
    altezzaPannello:x.scheda.classList.contains("comic-guide-open") && x.pannello
      ? x.pannello.scrollHeight : 0
  }));
  misure.forEach(({scheda,altezzaTesta,altezzaPannello})=>{
    scheda.style.setProperty("--altezza-testa-mobile",altezzaTesta+"px");
    scheda.style.height = Math.ceil(altezzaTesta+altezzaPannello)+"px";
  });
}

/* Le coordinate delle nove epoche cambiano soltanto quando cambia il
   layout (filtri, ricerca, apertura di una scheda o ridimensionamento),
   non durante il normale scroll. Tenerle in memoria evita letture di
   layout sincrone a ogni fotogramma, particolarmente costose nei webview. */
function misuraSezioniTimeline(){
  const paginaY = scrollY;
  metricheSezioni = sezioniTimeline.map(sezione=>{
    const r = sezione.getBoundingClientRect();
    return {top:r.top+paginaY,height:r.height};
  });
}
function programmaMetricheTimeline(){
  if(metricheTimelineAttese) return;
  metricheTimelineAttese = true;
  requestAnimationFrame(()=>{
    misuraSezioniTimeline();
    aggiornaProgressoEre();
    metricheTimelineAttese = false;
  });
}

function spia(gs){
  if(osservatoreDimensioni) osservatoreDimensioni.disconnect();
  sezioniTimeline = [...list.querySelectorAll(".group")];
  segmentiRibbon = [...ribbon.querySelectorAll(".seg")];
  intestazioniEpoche = [...list.querySelectorAll(".group-head")];
  primaIntestazioneEpoca = intestazioniEpoche[0] || null;
  const progressoCorrente = progressoHeaderCorrente.toFixed(4);
  if(vistaMobile.matches){
    intestazioniEpoche.forEach((intestazione,indice)=>
      intestazione.style.setProperty("--scroll-header-p",
        indice ? "1" : progressoCorrente));
  }
  misuraSezioniTimeline();
  if("ResizeObserver" in window){
    if(!osservatoreDimensioni) osservatoreDimensioni = new ResizeObserver(programmaMetricheTimeline);
    sezioniTimeline.forEach(sezione=>osservatoreDimensioni.observe(sezione));
  }
  misuraAltezzeNavigazione();
  ultimaEpocaAttiva = "";
  indiceEpocaAttiva = -1;
  aggiornaProgressoEre();
}

/* Il punto di lettura e' subito sotto nastro e filtri. La percentuale
   viene calcolata sull'altezza reale della sezione, quindi si aggiorna
   correttamente anche dopo una ricerca o il cambio dei filtri. */
let progressoEreAtteso = false;
let ultimaEpocaAttiva = "";
let indiceEpocaAttiva = -1;
let sospendiProgressoEre = false;
let centraturaRibbonTimer = null;
function lineaLetturaTimeline(){
  return altezzaBarra + 12;
}
function aggiornaProgressoEre(forza=false){
  if(sospendiProgressoEre && !forza) return;
  const sezioni = sezioniTimeline;
  const segmenti = segmentiRibbon;
  if(!sezioni.length || !segmenti.length) return;
  if(metricheSezioni.length !== sezioni.length) misuraSezioniTimeline();

  const linea = lineaLetturaTimeline();
  const punto = scrollY + linea;
  /* Rimane attiva l'ultima sezione il cui inizio e' stato superato.
     Cosi' gli spazi tra due gruppi non fanno saltare per un fotogramma
     l'indicatore all'ultima epoca della timeline. */
  let calcolata = 0;
  for(let i=0;i<metricheSezioni.length;i++){
    if(metricheSezioni[i].top <= punto) calcolata = i;
    else break;
  }

  /* Otto pixel di isteresi impediscono che arrotondamenti e caricamenti
     tardivi facciano alternare due epoche sui bordi della sezione. */
  let corrente = calcolata;
  if(!forza && indiceEpocaAttiva >= 0 && calcolata !== indiceEpocaAttiva){
    if(calcolata > indiceEpocaAttiva
      && punto < metricheSezioni[calcolata].top+8) corrente = indiceEpocaAttiva;
    else if(calcolata < indiceEpocaAttiva
      && punto > metricheSezioni[indiceEpocaAttiva].top-8) corrente = indiceEpocaAttiva;
  }
  corrente = Math.max(0,Math.min(segmenti.length-1,corrente));
  indiceEpocaAttiva = corrente;

  const rCorrente = metricheSezioni[corrente];
  const avanzamento = Math.min(1,Math.max(0,
    (punto-rCorrente.top) / Math.max(1,rCorrente.height)));

  segmenti.forEach((segmento,i)=>{
    const p = i < corrente ? 1 : i === corrente ? avanzamento : 0;
    const progresso = p.toFixed(4);
    const attivo = i === corrente;
    const completa = i < corrente;
    /* In ogni fotogramma cambia normalmente un solo segmento. Evitare di
       riscrivere anche gli altri sette riduce il lavoro del motore CSS. */
    if(segmento.__progressoEpoca !== progresso){
      segmento.__progressoEpoca = progresso;
      segmento.style.setProperty("--epoca-progress",progresso);
    }
    if(segmento.__epocaAttiva !== attivo){
      segmento.__epocaAttiva = attivo;
      segmento.setAttribute("aria-current",String(attivo));
    }
    if(segmento.__epocaCompleta !== completa){
      segmento.__epocaCompleta = completa;
      segmento.classList.toggle("epoca-completa",completa);
    }
  });

  const segmentoCorrente = segmenti[corrente];
  if(segmentoCorrente.dataset.go !== ultimaEpocaAttiva){
    ultimaEpocaAttiva = segmentoCorrente.dataset.go;
    /* Durante un salto verticale non avvia una seconda animazione
       orizzontale per ogni epoca attraversata. Al termine il segmento
       corretto viene centrato una sola volta. */
    if(vistaMobile.matches && !scrollAnimId){
      clearTimeout(centraturaRibbonTimer);
      /* La centratura parte soltanto dopo che lo scroll verticale si e'
         assestato: due animazioni perpendicolari simultanee facevano
         sfarfallare maschere e ombre nel compositore di WebKit. */
      centraturaRibbonTimer = setTimeout(()=>{
        centraturaRibbonTimer = null;
        if(scrollAnimId) return;
        const sinistra = Math.max(0,Math.min(ribbon.scrollWidth-ribbon.clientWidth,
          segmentoCorrente.offsetLeft-(ribbon.clientWidth-segmentoCorrente.offsetWidth)/2));
        ribbon.scrollTo({left:sinistra,behavior:
          matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
      },100);
    }
  }
}
function programmaProgressoEre(){
  if(progressoEreAtteso) return;
  progressoEreAtteso = true;
  requestAnimationFrame(()=>{
    aggiornaProgressoEre();
    progressoEreAtteso = false;
  });
}

/* Conserva il punto che l'utente sta leggendo quando un filtro accorcia
   la pagina. Se l'opera di riferimento viene nascosta, usa la stessa
   percentuale dell'epoca; se sparisce anche l'epoca, sceglie la piu'
   vicina tra quelle rimaste. */
function catturaPosizioneTimeline(tipoDaNascondere=""){
  if(scrollY < 2) return {inCima:true};
  const linea = lineaLetturaTimeline();
  const sezioni = [...list.querySelectorAll(".group")];
  if(!sezioni.length) return null;

  const ancora = [...list.querySelectorAll(".item")]
    .find(item=>item.dataset.operaTipo !== tipoDaNascondere
      && item.getBoundingClientRect().bottom > linea);
  let corrente = 0;
  for(let i=0;i<sezioni.length;i++){
    if(sezioni[i].getBoundingClientRect().top <= linea) corrente = i;
    else break;
  }
  const sezione = sezioni[corrente];
  const r = sezione.getBoundingClientRect();
  return {
    ancoraId:ancora?.id || "",
    ancoraScarto:ancora ? ancora.getBoundingClientRect().top-linea : 0,
    epocaId:sezione.id,
    epocaIndice:ERE.findIndex(e=>"epoca-"+e.id === sezione.id),
    avanzamento:Math.min(1,Math.max(0,(linea-r.top)/Math.max(1,r.height)))
  };
}

function ripristinaPosizioneTimeline(posizione){
  if(!posizione) return;
  if(posizione.inCima){scrollTo(0,0);return;}
  const applica = ()=>{
    aggiornaRibbon(true);
    const linea = lineaLetturaTimeline();
    const ancora = posizione.ancoraId && document.getElementById(posizione.ancoraId);
    if(ancora){
      scrollBy(0,ancora.getBoundingClientRect().top-linea-posizione.ancoraScarto);
    }else{
      const sezioni = [...list.querySelectorAll(".group")];
      let sezione = document.getElementById(posizione.epocaId);
      if(!sezione && sezioni.length){
        sezione = sezioni.reduce((migliore,candidata)=>{
          const indice = ERE.findIndex(e=>"epoca-"+e.id === candidata.id);
          const distanza = Math.abs(indice-posizione.epocaIndice);
          return !migliore || distanza < migliore.distanza
            ? {el:candidata,distanza} : migliore;
        },null)?.el;
      }
      if(sezione){
        const r = sezione.getBoundingClientRect();
        scrollBy(0,r.top+r.height*posizione.avanzamento-linea);
      }
    }
    aggiornaRibbon(true);
    aggiornaProgressoEre();
    aggiornaBackTop();
  };
  applica();
  requestAnimationFrame(applica);
}

/* ===================== scroll animato e "protetto" ====================== */
/* usato quando si clicca un'epoca nel nastro in alto: a differenza dello
   scroll nativo (che l'utente puo' interrompere in qualunque momento
   girando la rotellina o toccando lo schermo), qui blocchiamo rotellina
   e trascinamento touch finche' l'animazione non e' arrivata a destinazione */
let scrollAnimId = null, scrollBlocco = null, scrollSaltoTimer = null;
let headerSnapshotTimer = null;
let ultimoProgressoAnimazione = 0;
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function easeInOutQuart(t){
  return t < .5 ? 8*t*t*t*t : 1-Math.pow(-2*t+2,4)/2;
}
function easeInQuad(t){ return t*t; }
function easeOutSine(t){ return Math.sin(Math.PI*t/2); }
function aggiornaDopoScrollProtetto(forzaEpoca=false){
  ultimaEpocaAttiva = "";
  aggiornaRibbon(true);
  aggiornaProgressoEre(forzaEpoca);
  aggiornaBackTop();
  aggiornaParallasse();
}
/* Crea la copia soltanto quando inizia il tratto finto. Copiare i rettangoli
   gia' calcolati evita nuovi calcoli dell'header e, soprattutto, sottrae il
   nastro sticky al salto di composizione che Safari e Telegram mostrano
   durante il riposizionamento nascosto della pagina. */
function mostraHeaderDuranteSalto(){
  if(!vistaMobile.matches || jumpHeaderSnapshot.classList.contains("is-visible")) return;
  if(headerSnapshotTimer){
    clearTimeout(headerSnapshotTimer);
    headerSnapshotTimer = null;
  }
  const rNastro = ribbonNav.getBoundingClientRect();
  const rControlli = controls.getBoundingClientRect();
  const nastroCopia = ribbonNav.cloneNode(true);
  const controlliCopia = controls.cloneNode(true);
  const pulisci = radice=>{
    radice.querySelector("#mobileSearchToggle")?.classList.add("jump-search-toggle");
    radice.querySelector("#mobileFiltersToggle")?.classList.add("jump-filters-toggle");
    radice.removeAttribute("id");
    radice.querySelectorAll("[id]").forEach(el=>el.removeAttribute("id"));
    radice.querySelectorAll("button,input,[tabindex]").forEach(el=>
      el.setAttribute("tabindex","-1"));
    radice.querySelectorAll(".mobile-pressed").forEach(el=>el.classList.remove("mobile-pressed"));
  };
  pulisci(nastroCopia);
  pulisci(controlliCopia);
  Object.assign(nastroCopia.style,{
    top:rNastro.top.toFixed(2)+"px",left:rNastro.left.toFixed(2)+"px",
    width:rNastro.width.toFixed(2)+"px",height:rNastro.height.toFixed(2)+"px"
  });
  Object.assign(controlliCopia.style,{
    top:rControlli.top.toFixed(2)+"px",left:rControlli.left.toFixed(2)+"px",
    width:rControlli.width.toFixed(2)+"px",height:rControlli.height.toFixed(2)+"px"
  });
  jumpHeaderSnapshot.replaceChildren(nastroCopia,controlliCopia);
  jumpHeaderSnapshot.style.height = Math.ceil(Math.max(rNastro.bottom,rControlli.bottom))+"px";
  const tracciaCopia = nastroCopia.querySelector(".ribbon-track");
  if(tracciaCopia) tracciaCopia.scrollLeft = ribbon.scrollLeft;
  jumpHeaderSnapshot.classList.add("is-visible");
}
function nascondiHeaderDuranteSalto(sincronizza=false){
  if(headerSnapshotTimer){
    clearTimeout(headerSnapshotTimer);
    headerSnapshotTimer = null;
  }
  if(sincronizza) aggiornaDopoScrollProtetto(true);
  jumpHeaderSnapshot.classList.remove("is-visible");
  jumpHeaderSnapshot.replaceChildren();
  jumpHeaderSnapshot.style.removeProperty("height");
}
function terminaScrollProtetto(){
  scrollAnimId = null;
  sospendiProgressoEre = false;
  const riprendiCopertine = sospendiCaricamentoCopertine;
  sospendiCaricamentoCopertine = false;
  if(scrollSaltoTimer){
    clearTimeout(scrollSaltoTimer);
    scrollSaltoTimer = null;
  }
  jumpTransition.classList.remove("is-visible","is-exiting","verso-alto");
  if(scrollBlocco) scrollBlocco();
  if(riprendiCopertine) programmaRipresaCopertine();
  aggiornaDopoScrollProtetto(true);
  nascondiHeaderDuranteSalto();
}
function animaTrattoScroll(startY,targetY,durata,
  alTermine=terminaScrollProtetto,easing=easeInOutCubic){
  const distanza = targetY-startY;
  const t0 = performance.now();
  function passo(now){
    const p = Math.min(1,(now-t0)/durata);
    scrollTo(0,Math.round(startY+distanza*easing(p)));
    /* Lo scroll generato dall'animazione viene aggiornato qui nello stesso
       fotogramma. Il listener normale lo ignora, evitando una seconda coda
       requestAnimationFrame concorrente. */
    aggiornaRibbon();
    /* Il nastro e l'intestazione devono rappresentare l'epoca realmente
       attraversata anche durante uno scroll avviato dai pulsanti. Tenerli
       congelati fino all'arrivo faceva comparire insieme il titolo vecchio
       e quello nuovo, oltre a far lampeggiare il segmento selezionato. */
    /* Quando la copia stabile copre il nastro, aggiornare nove segmenti
       invisibili a ogni frame spreca composizione. Li sincronizziamo una
       sola volta prima di togliere la copia. */
    if(!jumpHeaderSnapshot.classList.contains("is-visible")
      && (p === 1 || now-ultimoProgressoAnimazione >= 32)){
      ultimoProgressoAnimazione = now;
      aggiornaProgressoEre(true);
    }
    const trattoCoperto = jumpTransition.classList.contains("is-visible")
      && !jumpTransition.classList.contains("is-exiting");
    /* Sotto un overlay opaco non muoviamo stelle e pulsante flottante:
       sono invisibili e su iPhone costringerebbero comunque il compositore
       a ridisegnare tre grandi superfici a ogni fotogramma. */
    if(!trattoCoperto){
      aggiornaBackTop();
      aggiornaParallasse();
    }
    if(p < 1) scrollAnimId = requestAnimationFrame(passo);
    else alTermine();
  }
  scrollAnimId = requestAnimationFrame(passo);
}
function annullaScrollProtetto(){
  if(scrollAnimId && scrollAnimId !== -1) cancelAnimationFrame(scrollAnimId);
  scrollAnimId = null;
  if(scrollSaltoTimer){
    clearTimeout(scrollSaltoTimer);
    scrollSaltoTimer = null;
  }
  jumpTransition.classList.remove("is-visible","is-exiting","verso-alto");
  nascondiHeaderDuranteSalto();
  sospendiProgressoEre = false;
  const riprendiCopertine = sospendiCaricamentoCopertine;
  sospendiCaricamentoCopertine = false;
  if(scrollBlocco) scrollBlocco();
  if(riprendiCopertine) programmaRipresaCopertine();
}
function scrollaProtetto(el){
  if(!el) return;
  annullaScrollProtetto();
  clearTimeout(centraturaRibbonTimer);
  centraturaRibbonTimer = null;
  ultimoProgressoAnimazione = 0;
  /* L'overlay usa l'ultima altezza gia' calcolata dell'header. Aggiornarla
     una volta all'avvio del salto evita una scrittura di stile per ogni
     fotogramma del normale scorrimento. */
  jumpTransition.style.setProperty("--bar-h",altezzaBarra.toFixed(2)+"px");

  const startY = scrollY;
  const maxY = Math.max(0,document.documentElement.scrollHeight-innerHeight);
  const targetY = Math.max(0,Math.min(maxY,el.getBoundingClientRect().top + scrollY));
  const distanza = targetY - startY;
  if(Math.abs(distanza) < 2) return;
  sospendiProgressoEre = true;
  sospendiCaricamentoCopertine = true;

  /* Le poche copertine iniziali della destinazione vengono richieste subito,
     mentre l'animazione e' ancora in corso, invece che tutte insieme dopo
     l'arrivo del salto. */
  precaricaCopertine(el,vistaMobile.matches ? 12 : 5);
  /* Nei salti mobili verso il basso il tratto reale riappare prima del
     titolo della nuova epoca, attraversando la coda di quella precedente.
     Prepararne le ultime copertine evita riquadri vuoti durante la dissolvenza. */
  if(vistaMobile.matches && distanza > 0)
    precaricaCopertine(el.previousElementSibling,10,true);

  const impedisci = e=>e.preventDefault();
  const bloccoTouchCss = vistaMobile.matches && CSS.supports("touch-action","none");
  addEventListener("wheel", impedisci, {passive:false});
  if(bloccoTouchCss) document.documentElement.classList.add("scroll-protetto");
  else addEventListener("touchmove", impedisci, {passive:false});
  scrollBlocco = () => {
    removeEventListener("wheel", impedisci, {passive:false});
    if(bloccoTouchCss) document.documentElement.classList.remove("scroll-protetto");
    else removeEventListener("touchmove", impedisci, {passive:false});
    scrollBlocco = null;
  };

  const movimentoRidotto = matchMedia("(prefers-reduced-motion:reduce)").matches;
  const saltoMobileLungo = vistaMobile.matches && !movimentoRidotto
    && Math.abs(distanza) > Math.max(2200,innerHeight*3);

  if(!saltoMobileLungo){
    const durata = movimentoRidotto ? 1 : vistaMobile.matches
      ? Math.min(620,Math.max(360,Math.abs(distanza)*.4))
      : Math.min(4000,Math.max(1200,850+Math.sqrt(Math.abs(distanza))*13.8));
    animaTrattoScroll(startY,targetY,durata,terminaScrollProtetto,
      vistaMobile.matches ? easeInOutCubic : easeInOutQuart);
    return;
  }

  /* Il movimento comincia con un tratto vero e completamente visibile.
     Soltanto dopo entra la versione alleggerita della timeline; concluso
     il trasferimento, un secondo tratto vero rimane visibile fino alla meta. */
  const verso = Math.sign(distanza);
  const trattoVisibileInizio = Math.min(760,Math.max(520,innerHeight*.78));
  const trattoCopertura = Math.min(320,Math.max(200,innerHeight*.3));
  const ingressoY = Math.max(0,Math.min(maxY,
    startY+verso*(trattoVisibileInizio+trattoCopertura)));
  const trattoFinale = Math.min(1400,Math.max(950,innerHeight*1.5));
  const preTargetY = Math.max(0,Math.min(maxY,targetY-verso*trattoFinale));
  jumpTransition.classList.toggle("verso-alto",verso < 0);
  /* La velatura comincia mentre questo stesso scroll e' ancora in corsa:
     il rallentamento finale resta nascosto e non sembra una fermata. */
  const durataIngresso = 700;
  scrollSaltoTimer = setTimeout(()=>{
    scrollSaltoTimer = null;
    mostraHeaderDuranteSalto();
    jumpTransition.classList.add("is-visible");
  },Math.round(durataIngresso*.58));
  animaTrattoScroll(startY,ingressoY,durataIngresso,()=>{
    mostraHeaderDuranteSalto();
    jumpTransition.classList.add("is-visible");
    scrollAnimId = -1;
    scrollSaltoTimer = setTimeout(()=>{
      scrollSaltoTimer = null;
      scrollTo(0,preTargetY);
      /* Il trasferimento avviene mentre l'overlay e' completamente visibile:
         sincronizziamo subito lo stato dell'epoca, prima della dissolvenza. */
      aggiornaDopoScrollProtetto(true);
      scrollAnimId = requestAnimationFrame(()=>{
          /* Il nastro compatto cambia leggermente l'altezza iniziale della
             pagina: ricalcolare qui la meta evita anche pochi pixel di
             sovraelongazione quando il salto parte proprio dall'inizio. */
          const maxAggiornato = Math.max(0,document.documentElement.scrollHeight-innerHeight);
          const metaAggiornata = Math.max(0,Math.min(maxAggiornato,
            el.getBoundingClientRect().top+scrollY));
          const partenzaFinale = scrollY;
          /* Lo scroll reale riparte sotto la velatura. La dissolvenza viene
             ritardata finche' sia le sagome sia la pagina non hanno gia'
             rallentato: il cambio di velocita' resta quindi invisibile. */
          scrollSaltoTimer = setTimeout(()=>{
            scrollSaltoTimer = null;
            jumpTransition.classList.add("is-exiting");
            /* Sotto la dissolvenza prepariamo lo stato reale dell'header e
               togliamo la copia quando e' ormai indistinguibile. */
            headerSnapshotTimer = setTimeout(()=>{
              headerSnapshotTimer = null;
              nascondiHeaderDuranteSalto(true);
            },220);
          },140);
          animaTrattoScroll(partenzaFinale,metaAggiornata,1150,
            terminaScrollProtetto,easeOutSine);
      });
    },24);
  },easeInQuad);
}

/* Il ritorno all'inizio compare solo dopo che la pagina e' stata
   percorsa abbastanza da renderlo davvero utile. */
let backTopVisibile = null;
function aggiornaBackTop(){

   evita che la diversa altezza dei controlli faccia saltare la lettura. */
function impostaControlliMobili({ricerca,filtri,focusRicerca=false}){
  if(!vistaMobile.matches) return;
  const posizioneScroll = scrollY;
  controls.classList.toggle("mobile-search-open",ricerca);
  controls.classList.toggle("mobile-filters-open",filtri);
  sincronizzaControlliMobili();

    aggiornaBackTop();

/* il nastro delle epoche si abbassa e il simbolo si rimpicciolisce in
   modo continuo, legato allo scroll (variabile --p, da 0 a 1): NON e'
   un interruttore on/off, quindi non scatta mai di colpo, nemmeno
   scorrendo pianissimo. --p arriva a 1 esattamente nell'istante in cui
   il nastro si aggancia (a --ribbon-gap dal bordo, non attaccato di
   netto), quindi il rimpicciolimento finisce proprio quando resta
   attaccato alla barra di ricerca, senza salti. */
const RIBBON_RANGE = 160;
const RIBBON_GAP = 12; /* deve combaciare con --ribbon-gap nel CSS */
const PASSI_MISURA_HEADER = 10;
let progressoHeaderCorrente = 0;
let corsaHeader = RIBBON_RANGE;
let campioniAltezzeHeader = [];
let ultimoRibbonP = "", ultimoShieldP = "", ultimoIngombroHeader = "";

/* Le dimensioni del nastro e dei controlli dipendono da molte proprieta'
   reali (padding, gap, font e altezze). Leggerne l'offsetHeight subito dopo
   averle cambiate, a ogni fotogramma, costringeva Safari e i WebView a due
   layout sincroni durante lo scroll. Misuriamo invece dieci stati invisibili
   una sola volta e interpoliamo i valori gia' pronti. */
function misuraAltezzeNavigazione(){
  const wrap = document.querySelector(".wrap");
  if(!wrap) return;
  const masthead = document.querySelector(".masthead");
  const margineNastro = parseFloat(getComputedStyle(ribbonNav).marginTop) || 0;
  /* La corsa parte davvero da zero e termina quando il nastro raggiunge
     il proprio top sticky. Prima il primo pixel di scroll produceva gia'
     circa il 15% di contrazione, causando uno scatto evidente su WebKit. */
  corsaHeader = Math.max(1,
    (masthead?.offsetTop || 0)+(masthead?.offsetHeight || RIBBON_RANGE)
      +margineNastro-RIBBON_GAP);
  const metro = document.createElement("div");
  metro.setAttribute("aria-hidden","true");
  Object.assign(metro.style,{
    position:"fixed",left:"0",top:"0",width:wrap.clientWidth+"px",
    visibility:"hidden",pointerEvents:"none",zIndex:"-1",
    transform:"translate3d(-200vw,0,0)"
  });
  const nastroMisura = ribbonNav.cloneNode(true);
  const controlliMisura = controls.cloneNode(true);
  nastroMisura.style.position = "static";
  nastroMisura.style.top = "auto";
  controlliMisura.style.position = "static";
  controlliMisura.style.top = "auto";
  metro.append(nastroMisura,controlliMisura);
  document.body.append(metro);

  const nuoviCampioni = [];
  for(let i=0;i<=PASSI_MISURA_HEADER;i++){
    const valore = (i/PASSI_MISURA_HEADER).toFixed(4);
    nastroMisura.style.setProperty("--p",valore);
    nastroMisura.style.setProperty("--scroll-header-p",valore);
    controlliMisura.style.setProperty("--scroll-header-p",valore);
    nuoviCampioni.push({
      nastro:nastroMisura.offsetHeight,
      controlli:controlliMisura.offsetHeight
    });
  }
  metro.remove();
  campioniAltezzeHeader = nuoviCampioni;
  ultimoIngombroHeader = "";
  aggiornaIngombroHeader(progressoHeaderCorrente,true);
}

function interpolaCampioniHeader(proprieta,p){
  if(!campioniAltezzeHeader.length) return null;
  const posizione = Math.min(PASSI_MISURA_HEADER,
    Math.max(0,p*PASSI_MISURA_HEADER));
  const indice = Math.min(PASSI_MISURA_HEADER-1,Math.floor(posizione));
  const frazione = posizione-indice;
  const a = campioniAltezzeHeader[indice][proprieta];
  const b = campioniAltezzeHeader[indice+1][proprieta];
  return a+(b-a)*frazione;
}

function aggiornaIngombroHeader(p,forza=false){
  let cima = interpolaCampioniHeader("nastro",p);
  let barra = interpolaCampioniHeader("controlli",p);
  /* Fallback usato soltanto nel primissimo avvio, prima che il nastro sia
     stato renderizzato. Non viene mai eseguito durante lo scroll normale. */
  if(cima === null || barra === null){
    cima = ribbonNav.offsetHeight;
    barra = controls.offsetHeight;
  }
  const topControlli = RIBBON_GAP+cima;
  altezzaBarra = topControlli+barra;
  const chiave = `${topControlli.toFixed(2)}|${altezzaBarra.toFixed(2)}`;
  if(!forza && chiave === ultimoIngombroHeader) return;
  ultimoIngombroHeader = chiave;
  controls.style.top = topControlli.toFixed(2)+"px";
  /* La timeline reale e' molto piu' alta del viewport: modificarne la
     min-height durante ogni fotogramma invalidava inutilmente tutto il suo
     layout. Serve soltanto nello stato vuoto. */
  if(!intestazioniEpoche.length)
    list.style.minHeight = `calc(100vh - ${altezzaBarra.toFixed(2)}px)`;
  else if(list.style.minHeight) list.style.removeProperty("min-height");
  /* La transizione mobile deve cominciare sotto il nastro e i controlli.
     La variabile globale non viene piu' aggiornata durante lo scroll per
     motivi di fluidita': la passiamo quindi soltanto all'overlay che la usa. */
  const topEpoca = altezzaBarra.toFixed(2)+"px";
  const cimaCompatta = interpolaCampioniHeader("nastro",1) ?? cima;
  const barraCompatta = interpolaCampioniHeader("controlli",1) ?? barra;
  const topEpocaCompatta = (RIBBON_GAP+cimaCompatta+barraCompatta).toFixed(2)+"px";
  /* Durante lo scroll cambia soltanto la prima intestazione: tutte le altre
     sono gia' nello stato compatto. Evitiamo quindi di attraversare e
     invalidare l'intera lista delle epoche a ogni fotogramma. */
  if(primaIntestazioneEpoca && primaIntestazioneEpoca.style.top !== topEpoca)
    primaIntestazioneEpoca.style.top=topEpoca;
  if(forza){
    intestazioniEpoche.slice(1).forEach(intestazione=>{
      if(intestazione.style.top !== topEpocaCompatta)
        intestazione.style.top=topEpocaCompatta;
    });
    jumpTransition.style.setProperty("--bar-h",altezzaBarra.toFixed(2)+"px");
  }
}

function applicaProgressoHeader(pTesto,shieldPTesto){
  progressoHeaderCorrente = Number(pTesto);
  /* Le variabili sono assegnate soltanto ai pochi elementi che le usano.
     Prima --scroll-header-p viveva su <html> e ne invalidava inutilmente
     tutta la lunga timeline a ogni pixel di scorrimento. */
  ribbonNav.style.setProperty("--p",pTesto);
  ribbonNav.style.setProperty("--mobile-shield-p",shieldPTesto);
  if(vistaMobile.matches){
    controls.style.setProperty("--scroll-header-p",pTesto);
    /* Durante la contrazione e' visibile soltanto la prima intestazione.
       Le successive nascono gia' compatte: non serve ricalcolarle tutte a
       ogni fotogramma mentre sono a migliaia di pixel dallo schermo. */
    if(primaIntestazioneEpoca)
      primaIntestazioneEpoca.style.setProperty("--scroll-header-p",pTesto);
  }
  aggiornaIngombroHeader(progressoHeaderCorrente);
}

function aggiornaRibbon(forza=false){
  /* Dipende soltanto dallo scroll e dalla corsa misurata fuori dal ciclo:
     nessuna lettura di layout dell'elemento sticky durante l'animazione. */
  const p = Math.min(1,Math.max(0,window.scrollY/corsaHeader));
  /* La barra trasparente di Telegram altera la posizione percepita del
     viewport: la schermatura dipende quindi dallo scroll reale, non dalla
     posizione sticky del nastro. Dopo pochi pixel diventa del tutto opaca. */
  const shieldP = Math.min(1, Math.max(0, window.scrollY/54));
  const pTesto = p.toFixed(4), shieldPTesto = shieldP.toFixed(4);
  /* Dopo che il nastro e' completamente compatto questi valori restano
     invariati per quasi tutta la pagina: evita di invalidare stile e
     layout a ogni fotogramma senza alcun cambiamento visivo. */
  if(!forza && pTesto === ultimoRibbonP && shieldPTesto === ultimoShieldP) return;
  ultimoRibbonP = pTesto;
  ultimoShieldP = shieldPTesto;
  applicaProgressoHeader(pTesto,shieldPTesto);
}
aggiornaRibbon(true);

/* altezza del pannello scuro fisso sopra (titolo + nastro): arriva
   esattamente fino a dove inizia .controls (il suo offsetTop, che per
   un elemento sticky riflette la posizione "normale", non agganciata) */
function aggiornaTopPanel(){
  if(!topPanel) return;
  const altezza = controls.offsetTop+"px";
  if(topPanel.style.getPropertyValue("--top-panel-h") !== altezza)
    topPanel.style.setProperty("--top-panel-h",altezza);
}
render();

  document.fonts.ready.then(()=>requestAnimationFrame(()=>{
    misuraAltezzeNavigazione();
    aggiornaRibbon(true);
    /* Anche le schede vanno misurate con i caratteri definitivi: durante
       il primo caricamento quelli provvisori possono occupare piu' righe. */
    aggiornaIngombriSchede();
    aggiornaTopPanel();
    programmaMetricheTimeline();
  }));
}

/* altezza della pagina "congelata" una volta sola: i pianeti e la
   parallasse la condividono, cosi' restano coerenti fra loro anche se
   nel frattempo il layout cambiasse leggermente */
const ALTEZZA_PAGINA = document.documentElement.scrollHeight;

/* pianeti disattivati per ora: davano scatti durante lo scroll su alcuni
   dispositivi/browser, nonostante i vari tentativi di alleggerirli.
   Da riprendere in un secondo momento. Basta rimettere a true per
   riattivarli (il resto del codice, DATI comprese, e' rimasto intatto) */
const PIANETI_ATTIVI = false;

/* ============================ stelle =================================== */
/* una piccola texture disegnata su canvas, ripetuta all'infinito come
   sfondo: cosi' il campo stellare copre TUTTA la pagina (non si esaurisce
   mai, qualunque sia la lunghezza) restando comunque leggerissimo, perche'
   ripetere una texture non costa quasi nulla al browser - a differenza
   delle centinaia di elementi HTML usate in precedenza */
(function pianificaStelle(){
  const strati = [...document.querySelectorAll("#stelle .layer")];
  /* piastrella piccola e leggera (il peso su schermi mobili viene dalla
     dimensione della texture, non da quante volte si ripete): niente
     piu' "banda galattica" a raggruppare le stelle, perche' su una
     texture che si ripete un addensamento riconoscibile diventa un
     motivo che si nota tornare identico lungo la pagina. Con le stelle
     sparse in modo uniforme la ripetizione non si nota, anche se la
     piastrella e' piccola */
  const conta = [45, 28, 13];               // per piastrella: il grosso delle stelle sta lontano
  const TW = 520, TH = 820;

  /* Le tinte restano appena percettibili: il nucleo e' quasi sempre
     bianco, mentre il colore compare soprattutto nell'alone. */
  const COLORI = [["#f8faff",52],["#dce8ff",19],["#c5d8ff",6],
                  ["#fff4df",17],["#ffd9b5",6]];
  const totPeso = COLORI.reduce((s,c)=>s+c[1],0);
  const colore = ()=>{
    let r = Math.random()*totPeso;
    for(const [c,w] of COLORI){ if((r -= w) <= 0) return c; }
    return "#fff";
  };
  const rgba = (hex,a)=>{
    const n = parseInt(hex.slice(1),16);
    return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;
  };

  const pianifica = cb=>{
    if("requestIdleCallback" in window)
      requestIdleCallback(cb,{timeout:1200});
    else setTimeout(cb,80);
  };
  const disegnaStrato = i=>{
    const s = strati[i];
    const cv = document.createElement("canvas");
    cv.width = TW; cv.height = TH;
    const ctx = cv.getContext("2d");
    for(let n=0;n<conta[i];n++){
      /* Tante stelle minute e poche luminose, con nucleo, alone e — solo
         per le piu' forti — sottili raggi di diffrazione. */
      const m = Math.pow(Math.random(), 3.25);
      const d = (0.45 + m*2.25) * (1 + i*0.3);
      const op = Math.min(.86, (0.12 + m*.7) * (0.65 + i*.12));
      const c  = colore();
      const x = 10 + Math.random()*(TW-20), y = 10 + Math.random()*(TH-20);

      ctx.save();
      if(m > .32){
        const alone = d*(2.2 + m*1.8);
        const luce = ctx.createRadialGradient(x,y,0,x,y,alone);
        luce.addColorStop(0,"rgba(255,255,255,.82)");
        luce.addColorStop(.12,rgba(c,.62));
        luce.addColorStop(.48,rgba(c,.12));
        luce.addColorStop(1,"rgba(255,255,255,0)");
        ctx.globalAlpha = op*.58;
        ctx.fillStyle = luce;
        ctx.fillRect(x-alone,y-alone,alone*2,alone*2);
      }

      if(m > .78){
        const raggio = d*(3.1 + m*2);
        const verticale = ctx.createLinearGradient(x,y-raggio,x,y+raggio);
        verticale.addColorStop(0,"rgba(255,255,255,0)");
        verticale.addColorStop(.5,rgba(c,.75));
        verticale.addColorStop(1,"rgba(255,255,255,0)");
        ctx.globalAlpha = op*.74;ctx.strokeStyle = verticale;
        ctx.lineWidth = Math.max(.42,d*.11);
        ctx.beginPath();ctx.moveTo(x,y-raggio);ctx.lineTo(x,y+raggio);ctx.stroke();

        const raggioH = raggio*.72;
        const orizzontale = ctx.createLinearGradient(x-raggioH,y,x+raggioH,y);
        orizzontale.addColorStop(0,"rgba(255,255,255,0)");
        orizzontale.addColorStop(.5,rgba(c,.62));
        orizzontale.addColorStop(1,"rgba(255,255,255,0)");
        ctx.strokeStyle = orizzontale;
        ctx.beginPath();ctx.moveTo(x-raggioH,y);ctx.lineTo(x+raggioH,y);ctx.stroke();

        /* piccola losanga centrale: evita l'aspetto da semplice cerchio */
        const punta = d*(1.05 + m*.75), fianco = Math.max(.5,d*.26);
        ctx.globalAlpha = op*.82;
        ctx.fillStyle = "#fff";
        ctx.beginPath();ctx.moveTo(x,y-punta);ctx.lineTo(x+fianco,y);
        ctx.lineTo(x,y+punta);ctx.lineTo(x-fianco,y);ctx.closePath();ctx.fill();
      }

      const nucleo = Math.max(.42,d*.48);
      const centro = ctx.createRadialGradient(x,y,0,x,y,nucleo);
      centro.addColorStop(0,"#fff");
      centro.addColorStop(.32,"#fff");
      centro.addColorStop(.7,c);
      centro.addColorStop(1,"rgba(255,255,255,0)");
      ctx.globalAlpha = op;
      ctx.fillStyle = centro;
      ctx.beginPath();ctx.arc(x,y,nucleo,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    const texture = `url(${cv.toDataURL()})`;
    s.style.backgroundImage = texture;
    /* Ogni texture viene codificata in un momento libero separato. In questo
       modo il browser puo' mostrare e usare la pagina prima di preparare i
       due livelli successivi, senza cambiare il risultato finale. */
    if(i+1 < strati.length) pianifica(()=>disegnaStrato(i+1));
  };
  pianifica(()=>disegnaStrato(0));
})();

/* ============================ pianeti (parallasse) ====================== */
(function pianeti(){
  if(!PIANETI_ATTIVI) return;
  const cont = document.getElementById("pianeti");
  const H = ALTEZZA_PAGINA;
  /* segnaposto a cerchio: quando arrivano i PNG basta sostituire il
     background di ogni .pianeta con l'immagine, il resto (posizione,
     profondita', dimensione) resta invariato. "pos" e' la posizione
     lungo tutta la pagina (0-100%), cosi' sono distribuiti sull'intera
     timeline invece che ammassati in cima */
  const DATI = [
    {chiave:"jakku",     depth:.14, pos: 3, left: 6, d: 70, c:"#a8734a"},
    {chiave:"hoth",      depth:.32, pos:12, left:90, d: 85, c:"#c7d4de"},
    {chiave:"kamino",    depth:.20, pos:22, left: 2, d:100, c:"#3a5f7a"},
    {chiave:"dagobah",   depth:.44, pos:32, left:84, d: 90, c:"#3f5a3f"},
    {chiave:"naboo",     depth:.10, pos:42, left: 4, d:130, c:"#4f7f8a"},
    {chiave:"coruscant", depth:.36, pos:52, left:88, d:145, c:"#8a8570"},
    {chiave:"endor",     depth:.24, pos:62, left: 8, d:165, c:"#5f7a52"},
    {chiave:"mustafar",  depth:.48, pos:72, left:82, d:180, c:"#8a4530"},
    {chiave:"bespin",    depth:.16, pos:83, left: 4, d:210, c:"#b98a55"},
    {chiave:"tatooine",  depth:.28, pos:93, left:78, d:250, c:"#c9a066"},
  ];
  cont.innerHTML = DATI.map(p=>{
    const op = (0.32 + p.d/250*0.42).toFixed(2);
    const top = p.pos/100*H;
    return `<span class="pianeta" data-pianeta="${p.chiave}" data-depth="${p.depth}" data-base="${top.toFixed(0)}" style="
      top:${top.toFixed(0)}px;left:${p.left}%;width:${p.d}px;height:${p.d}px;opacity:${op};
      background:radial-gradient(circle at 32% 28%,
        color-mix(in srgb,${p.c} 82%,white),${p.c} 55%,
        color-mix(in srgb,${p.c} 70%,black) 100%);">
      <img src="simboli/${p.chiave}.png" alt="" draggable="false" loading="lazy" decoding="async"></span>`;
  }).join("");
  /* se manca il file immagine resta il cerchio sfumato come segnaposto */
  cont.querySelectorAll("img").forEach(im=> im.onerror = ()=> im.remove());
})();

/* ============================ scroll parallasse ========================= */
let aggiornaParallasse = ()=>{};
(function parallasse(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  /* STELLE: le texture si spostano come livelli compositi, operazione molto
     piu' leggera del ridisegno continuo di background-position. Il modulo
     di 820px e' invisibile perche' coincide esattamente con l'altezza della
     piastrella ripetuta, quindi velocita' e resa del parallasse non cambiano.
     PIANETI: elementi assoluti distribuiti sull'intera pagina (devono
     comparire ognuno vicino alla propria epoca). NON hanno un
     contenitore overflow:hidden grande quanto la pagina (con le foto vere
     era quello a rendere pesante la composizione): il limite ai bordi
     pagina lo mette direttamente questo clamp, con un margine ampio cosi'
     il movimento resta comunque fluido finche' sono vicini allo schermo. */
  const CAP_PIANETI = 2600;
  const ALTEZZA_PIASTRELLA_STELLE = 820;
  const stelleStrati = [...document.querySelectorAll("#stelle .layer")]
    .map(el=>({el,depth:Number(el.dataset.depth),ultima:""}));
  const pianetiEl = [...document.querySelectorAll("#pianeti .pianeta")]
    .map(el=>({el,depth:Number(el.dataset.depth),base:Number(el.dataset.base)}));
  const intervalloMobile = vistaMobile.matches ? 32 : 0;
  let ultimoAggiornamento = 0, timerParallasse = null;

  aggiornaParallasse = (forza=false)=>{
    const ora = Date.now();
    const attesa = intervalloMobile-(ora-ultimoAggiornamento);
    if(!forza && intervalloMobile && attesa > 0){
      if(!timerParallasse) timerParallasse = setTimeout(()=>{
        timerParallasse = null;
        aggiornaParallasse(true);
      },attesa);
      return;
    }
    if(timerParallasse){
      clearTimeout(timerParallasse);
      timerParallasse = null;
    }
    ultimoAggiornamento = ora;
    /* Il rimbalzo elastico dei WebView iOS puo' rendere scrollY negativo.
       Lasciarlo entrare nel modulo sposterebbe i livelli verso il basso e
       scoprirebbe temporaneamente il bordo superiore del campo stellare. */
    const y = Math.max(0,scrollY);
    stelleStrati.forEach(strato=>{
      const {el,depth} = strato;
      const t = (y*depth) % ALTEZZA_PIASTRELLA_STELLE;
      const posizione = (-t).toFixed(1);
      if(posizione === strato.ultima) return;
      strato.ultima = posizione;
      el.style.transform = `translate3d(0,${posizione}px,0)`;
    });
    pianetiEl.forEach(pianeta=>{
      const {el,depth,base} = pianeta;
      const grezzo = Math.max(-CAP_PIANETI, Math.min(CAP_PIANETI, (y-base)*(1-depth)));
      const t = Math.max(-base, Math.min(ALTEZZA_PAGINA-base, grezzo));
      el.style.transform = `translate3d(0,${t.toFixed(1)}px,0)`;
    });
  };
})();

/* Un solo aggiornamento coordinato per fotogramma sostituisce i quattro
   listener indipendenti che prima si contendevano layout e composizione. */
let scrollGeneraleAtteso = false;
function programmaScrollGenerale(){
  if(scrollAnimId) return;
  if(scrollGeneraleAtteso) return;
  scrollGeneraleAtteso = true;
  requestAnimationFrame(()=>{
    scrollGeneraleAtteso = false;
    /* Un salto puo' iniziare dopo l'accodamento di questo frame. In quel
       caso gli aggiornamenti sono gia' gestiti dall'animazione protetta. */
    if(scrollAnimId) return;
    aggiornaRibbon();
    aggiornaProgressoEre();
    aggiornaBackTop();
    aggiornaParallasse();
  });
}
addEventListener("scroll",programmaScrollGenerale,{passive:true});
programmaScrollGenerale();

if(location.hash.startsWith("#opera-")){
  const id = location.hash.slice(7);
  if(OPERE.some(x=>x.id === id)){
    setTimeout(()=>document.getElementById("opera-"+id)?.scrollIntoView({block:"center"}),80);
  }
}
</script>
