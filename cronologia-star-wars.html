<style>
@font-face{font-family:"Barlow";src:url("font/barlow-400.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url("font/barlow-500.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:"Barlow";src:url("font/barlow-600.woff2") format("woff2");font-style:normal;font-weight:600;font-display:swap}
@font-face{font-family:"Barlow";src:url("font/barlow-700.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}

:root{
  --bg:#03050B;
  --panel:rgba(9,14,24,.72);
  --panel-solid:#090E18;
  --line:rgba(148,178,206,.15);
  --line-strong:rgba(148,178,206,.3);
  --ink:#E2EAF4;
  --ink-dim:#8B9EB2;
  --ink-faint:#5F7286;
  --bar-h:0px;
  --ribbon-gap:12px;
  --scroll-header-p:0;
  --r:11px;
  --display:"Saira Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
img{
  user-select:none;-webkit-user-select:none;
  -webkit-user-drag:none;-webkit-touch-callout:none
}
/* Fondale di sicurezza per i browser iOS incorporati. Durante il rimbalzo
   verticale WebKit puo' sospendere per un istante i livelli fixed: queste
   velature restano dipinte sul documento e impediscono che affiori una
   schermata nera uniforme. Non contiene stelle, che appartengono soltanto
   ai livelli del parallasse. */
html{-webkit-text-size-adjust:100%;color-scheme:dark;overscroll-behavior-y:none;
  min-height:100%;background-color:#03050B;
  background-image:
    linear-gradient(180deg,transparent 0%,rgba(31,58,99,.28) 20%,
      transparent 48%,rgba(55,36,82,.17) 75%,transparent 100%),
    linear-gradient(90deg,rgba(31,58,99,.1),transparent 38%,
      transparent 64%,rgba(55,36,82,.08)),
    linear-gradient(180deg,#07101D 0%,#03050C 42%,#060814 72%,#07101D 100%);
  background-size:100% 1180px,100% 1180px,100% 1180px;
  background-position:0 0,0 0,0 0;
  background-repeat:repeat-y,repeat-y,repeat-y}
body{
  margin:0;min-height:100%;background-color:var(--bg);
  background-image:
    linear-gradient(180deg,transparent 0%,rgba(31,58,99,.28) 20%,
      transparent 48%,rgba(55,36,82,.17) 75%,transparent 100%),
    linear-gradient(90deg,rgba(31,58,99,.1),transparent 38%,
      transparent 64%,rgba(55,36,82,.08)),
    linear-gradient(180deg,#07101D 0%,#03050C 42%,#060814 72%,#07101D 100%);
  background-size:100% 1180px,100% 1180px,100% 1180px;
  background-position:0 0,0 0,0 0;
  background-repeat:repeat-y,repeat-y,repeat-y;
  color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:none;
}
html.scroll-protetto,html.scroll-protetto body{touch-action:none}

/* ============================ campo stellare ============================ */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  contain:strict;isolation:isolate;transform:translateZ(0);backface-visibility:hidden;
  background-color:#03050B;
  /* Una trama stellare molto discreta fa parte del fondale statico. I tre
     strati in #stelle continuano a produrre tutto il parallasse, ma se il
     webview i sospende durante uno scorrimento rapido resta comunque una
     superficie spaziale completa anziche' il solo colore quasi nero. */
  background-image:
    radial-gradient(circle at 23px 31px,rgba(242,247,255,.46) 0 .65px,transparent .95px),
    radial-gradient(circle at 91px 137px,rgba(193,216,250,.34) 0 .7px,transparent 1px),
    radial-gradient(circle at 211px 83px,rgba(255,237,207,.27) 0 .75px,transparent 1.1px),
    radial-gradient(ellipse 85% 58% at 10% 7%,rgba(38,67,112,.25),transparent 66%),
    radial-gradient(ellipse 72% 52% at 90% 88%,rgba(67,39,91,.18),transparent 68%),
    linear-gradient(180deg,#080D19 0%,#03050C 43%,#060814 74%,#020308 100%);
  background-size:173px 211px,257px 331px,389px 487px,auto,auto,auto;
  background-position:0 0,37px 59px,83px 127px,0 0,0 0,0 0;
  background-repeat:repeat,repeat,repeat,no-repeat,no-repeat,no-repeat}
/* Velature interstellari statiche: aggiungono profondita' senza nuovi
   elementi, immagini o animazioni e quindi senza lavoro extra durante
   lo scorrimento. */
#sky::before{content:"";position:absolute;inset:-8%;opacity:.9;
  background:
    radial-gradient(ellipse 38% 22% at 78% 18%,rgba(86,119,170,.11),transparent 72%),
    radial-gradient(ellipse 32% 25% at 16% 76%,rgba(42,95,121,.095),transparent 74%),
    radial-gradient(ellipse 58% 13% at 52% 49%,rgba(166,188,219,.06),transparent 75%),
    linear-gradient(116deg,transparent 20%,rgba(78,105,147,.022) 34%,
      rgba(184,201,224,.052) 48%,rgba(73,99,139,.026) 60%,transparent 73%)}
/* Le stelle sono piccole texture piastrellate dentro un contenitore fisso.
   Ogni strato ha 820px di margine sopra e sotto: puo' muoversi sulla GPU
   di un'intera piastrella e poi ripartire dalla stessa immagine, senza
   ridisegnare lo sfondo o lasciare bordi scoperti. */
#stelle{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  contain:strict;backface-visibility:hidden}
/* Il movimento e' sempre verso l'alto e non richiede un'intera piastrella
   di margine anche sotto il livello: dimezzare il margine invisibile riduce
   nettamente la memoria delle tre superfici composite, senza cambiare
   texture, velocita' o parallasse. */
#stelle .layer{position:absolute;top:0;left:0;width:100%;
  height:calc(100% + 820px);background-repeat:repeat;
  will-change:transform;transform:translate3d(0,0,0)}
/* i pianeti restano distribuiti su tutta la pagina (devono comparire
   ognuno vicino alla propria epoca), ma SENZA un contenitore enorme con
   overflow:hidden lungo quanto tutta la pagina: era proprio quello, non
   le immagini, a rendere la loro composizione pesante durante lo scroll.
   Qui il limite ai bordi lo mette direttamente il JS (vedi parallasse) */
#pianeti{position:absolute;top:0;left:0;width:100%;z-index:0;pointer-events:none}
#pianeti .pianeta{position:absolute;border-radius:50%;will-change:transform;overflow:hidden;
  content-visibility:auto;contain-intrinsic-size:250px 250px}
#pianeti .pianeta img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
/* banda della via lattea: alone diffuso di stelle non risolte */
#sky .banda{position:absolute;left:-42%;right:-42%;top:-10%;height:160vh;
  transform:rotate(-26deg);filter:blur(42px);opacity:.7;
  background:
    radial-gradient(ellipse 19% 6% at 52% 50%,rgba(222,230,246,.085),transparent 76%),
    radial-gradient(ellipse 34% 18% at 34% 49%,rgba(205,216,239,.11),transparent 72%),
    radial-gradient(ellipse 28% 17% at 72% 53%,rgba(102,132,181,.1),transparent 74%),
    linear-gradient(to bottom,transparent 28%,rgba(112,137,183,.035) 37%,
      rgba(168,184,216,.12) 49%,rgba(102,128,173,.055) 60%,transparent 71%)}
/* corsia di polvere che oscura la banda */
#sky .polvere{position:absolute;left:-42%;right:-42%;top:-10%;height:160vh;
  transform:rotate(-26deg);filter:blur(34px);opacity:.72;
  background:
    radial-gradient(ellipse 26% 8% at 28% 50%,rgba(1,3,8,.64),transparent 76%),
    linear-gradient(to bottom,transparent 43%,rgba(2,4,9,.68) 49%,
      rgba(2,4,9,.54) 52%,transparent 59%)}

/* nubi: forme irregolari, non cerchi */
#sky .neb{position:absolute;opacity:.43;mix-blend-mode:screen}
#sky .neb.a{width:78vw;height:52vw;left:-24vw;top:-14vh;filter:blur(88px);
  border-radius:62% 38% 55% 45%/48% 62% 38% 52%;
  background:
    radial-gradient(60% 55% at 42% 46%,rgba(48,88,156,.38),transparent 72%),
    radial-gradient(34% 42% at 65% 60%,rgba(38,112,143,.16),transparent 72%)}
#sky .neb.b{width:58vw;height:44vw;right:-18vw;top:38vh;filter:blur(76px);
  border-radius:44% 56% 38% 62%/58% 42% 58% 42%;
  background:
    radial-gradient(58% 60% at 55% 44%,rgba(111,47,95,.3),transparent 70%),
    radial-gradient(30% 38% at 32% 62%,rgba(58,49,113,.18),transparent 72%)}
#sky .neb.c{width:86vw;height:46vw;left:6vw;top:112vh;filter:blur(96px);
  border-radius:55% 45% 62% 38%/40% 58% 42% 60%;
  background:radial-gradient(62% 52% at 48% 52%,rgba(29,91,113,.27),transparent 72%)}
#sky .neb.d{width:40vw;height:34vw;left:52vw;top:-6vh;filter:blur(64px);opacity:.35;
  border-radius:58% 42% 46% 54%/52% 46% 54% 48%;
  background:radial-gradient(55% 55% at 50% 50%,rgba(133,65,51,.24),transparent 70%)}
/* nube scura in primo piano: nasconde le stelle dietro di sé */
#sky .buio{position:absolute;left:-10vw;top:58vh;width:70vw;height:40vw;
  filter:blur(72px);opacity:.58;
  border-radius:48% 52% 60% 40%/56% 44% 56% 44%;
  background:radial-gradient(58% 58% at 50% 50%,rgba(2,4,9,.92),transparent 72%)}
#sky::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse at center,transparent 30%,rgba(1,3,8,.21) 100%),
    linear-gradient(to bottom,rgba(3,5,11,.14),rgba(3,5,11,.43))}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 20px 110px}

/* ============================== testata ================================ */
@font-face{font-family:"Aurebesh";src:url("font/Aurebesh.ttf") format("truetype");
  font-display:swap}
@font-face{font-family:"StarJedi";src:url("font/StarJedi.ttf") format("truetype");
  font-display:swap}
/* pannello scuro fisso che copre titolo + nastro, dal vero bordo dello
   schermo fino al bordo superiore della barra di ricerca (dove inizia
   .controls::before): un unico blocco scuro coerente, non solo dietro
   alla barra di ricerca. Altezza impostata da JS (aggiornaTopPanel),
   perche' dipende dal contenuto del titolo/nastro */
.top-panel{position:absolute;top:0;left:50%;width:100vw;margin-left:-50vw;
  height:var(--top-panel-h,0px);z-index:-1;
  background:rgba(3,5,11,.97)}
.masthead{padding:52px 0 26px}
.masthead h1{
  font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:clamp(26px,6.8vw,54px);line-height:1;letter-spacing:.01em;margin:0;
  white-space:nowrap;
  text-shadow:0 0 42px rgba(120,170,230,.28);
}
.masthead .aurebesh{margin:9px 0 0;font-family:"Aurebesh",var(--display);
  font-size:15px;letter-spacing:.04em;color:var(--ink-faint);opacity:.7}
.group-head .aurebesh{display:block;margin:1px 0 8px;text-align:center;
  font-family:"Aurebesh",var(--display);font-size:10.8px;letter-spacing:.04em;
  color:var(--c);opacity:.55}

/* ========================== nastro delle ere =========================== */
/* i riquadri seguono lo schermo come la barra di ricerca: mano a mano che
   si scorre si abbassano di altezza e il simbolo si rimpicciolisce, in
   modo continuo e legato allo scroll (variabile --p, 0 = a riposo, 1 =
   agganciati in cima), finche' non restano attaccati alla barra di
   ricerca. Nessuna classe "on/off": tutto e' calc(...) su --p, cosi'
   non c'e' uno scatto quando si scorre piano invece che di colpo.
   Le colonne (9, larghezza uguale) NON cambiano mai posizione: si
   riduce solo l'altezza del contenuto. */
.ribbon{position:sticky;top:var(--ribbon-gap);z-index:32;margin:32px 0 0;--p:0;
  will-change:transform;transform:translateZ(0)}
/* lo sfondo pieno (e la riga sotto) servono solo a coprire i contenuti
   che scorrono sotto una volta che il nastro e' DAVVERO agganciato in
   cima: se lo si lega alla stessa variabile continua --p del
   rimpicciolimento, per un lungo tratto si vede una riga "a meta'",
   senza lo sfondo scuro pieno che la accompagna, che sembra un
   difetto. Compare quindi in un solo scatto (ma dolce, via transition)
   quando il nastro si ferma del tutto, non mentre si sta ancora
   riducendo. */
/* la fascia scura arriva fino al vero bordo dello schermo (top negativo
   pari a --ribbon-gap): solo i riquadri restano "sospesi" un po' piu'
   in basso, con un margine di respiro sopra di loro */
.ribbon::before{content:"";position:absolute;top:calc(-1*var(--ribbon-gap));bottom:0;left:50%;
  width:100vw;margin-left:-50vw;z-index:-1;
  background:rgba(3,5,11,1)}
.ribbon-track{display:flex;gap:6px;align-items:stretch;
  padding:calc(6px*(1 - var(--p))) 0}
.seg{
  position:relative;flex:1 1 0;min-width:0;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;justify-content:center;
  gap:calc(9px*(1 - var(--p)));
  padding:calc(11px*(1 - var(--p)) + 6px*var(--p)) 12px calc(12px*(1 - var(--p)) + 6px*var(--p));
  border-radius:10px;
  border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
  background:linear-gradient(to bottom,
    color-mix(in srgb,var(--c) 15%,transparent),
    color-mix(in srgb,var(--c) 4%,transparent));
  overflow:hidden;isolation:isolate;
  transform-origin:center bottom;
  transition:border-color .2s ease,background .2s ease,box-shadow .25s ease,transform .22s cubic-bezier(.3,.8,.3,1);
}
/* La velatura avanza insieme allo scroll della sezione. Le epoche gia'
   percorse restano piene, quella corrente mostra la posizione esatta. */
.seg::before{
  content:"";position:absolute;z-index:0;inset:1px;
  border-radius:9px;pointer-events:none;
  background:linear-gradient(90deg,
    color-mix(in srgb,var(--c) 28%,transparent),
    color-mix(in srgb,var(--c) 17%,transparent));
  transform:scaleX(var(--epoca-progress,0));transform-origin:left center;
  will-change:transform;
}
.seg>*{position:relative;z-index:1}
.seg[aria-current="true"]{
  border-color:color-mix(in srgb,var(--c) 88%,#fff 12%);
  box-shadow:0 0 10px color-mix(in srgb,var(--c) 54%,transparent),
             0 0 22px color-mix(in srgb,var(--c) 24%,transparent),
             inset 0 0 10px color-mix(in srgb,var(--c) 14%,transparent);
}
.seg.epoca-completa{
  border-color:color-mix(in srgb,var(--c) 62%,#DCE7F4 8%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 17%,transparent),
             0 0 8px color-mix(in srgb,var(--c) 13%,transparent);
}
.seg[aria-current="true"] .sigillo{
  opacity:1;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--c) 70%,transparent));
}
.sigillo{align-self:center;
  width:calc(46px - 20px*var(--p));height:calc(46px - 20px*var(--p));
  margin:calc(1px*(1 - var(--p))) 0 calc(3px*(1 - var(--p)));opacity:.8;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .2s ease,filter .2s ease}
/* il simbolo viene usato come maschera: prende il colore dell'epoca,
   qualunque sia il colore del file di partenza */
.sigillo:not(.vuoto):not(.naturale){
  background-color:var(--c);
  -webkit-mask:var(--sig) center/contain no-repeat;
          mask:var(--sig) center/contain no-repeat;
}
.sigillo:not(.vuoto):not(.naturale) img{width:100%;height:100%;opacity:0}
/* modalita a colori originali (TINTA_SIMBOLI = false) */
.sigillo.naturale img{max-width:100%;max-height:100%;object-fit:contain}
.sigillo.vuoto{border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  border-radius:50%;opacity:.55}
.sigillo.vuoto img{display:none}
.seg i{display:block;height:calc(3px*(1 - var(--p)));border-radius:2px;background:var(--c);
  opacity:calc(.55*(1 - var(--p)));
  transition:opacity .2s ease,box-shadow .2s ease}
.seg em{
  font-family:var(--display);font-style:normal;font-weight:800;font-size:12.2px;
  text-transform:uppercase;font-stretch:normal;
  line-height:1.5;letter-spacing:.01em;color:color-mix(in srgb,var(--c) 65%,#E2EAF4 35%);white-space:pre-line;
  text-align:center;
  transition:color .2s ease,font-size .2s ease,text-shadow .2s ease;
}
/* il blocco titolo+data e' centrato nel riquadro (non piu' ancorato al
   fondo: al passaggio del cursore, quando compare la data, risultava
   troppo spostato verso il basso) */
.dati{padding-top:calc(7px*(1 - var(--p)));display:flex;flex-direction:column;
  align-items:center;gap:3px;max-height:calc(48px*(1 - var(--p)));overflow:hidden;
  opacity:calc(1 - var(--p)*2.2);
  font-family:var(--body);font-size:12px;font-variant-numeric:tabular-nums;
  letter-spacing:.015em}
.dati u{text-decoration:none;color:var(--c);opacity:0;white-space:nowrap;
  text-align:center;transition:opacity .2s ease}

.seg:focus-visible{border-color:color-mix(in srgb,var(--c) 62%,transparent)}
.seg:focus-visible em{color:#fff;font-size:10.5px;
  text-shadow:0 0 14px var(--c),0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
.seg:focus-visible i{opacity:1;box-shadow:0 0 26px 1px var(--c)}
.seg:focus-visible .dati u{opacity:.95}
.seg:focus-visible .sigillo{
  opacity:1;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c) 75%,transparent))}
@media (hover:hover) and (min-width:761px){
  .seg:hover{transform:scale(1.055);z-index:2;
    border-color:color-mix(in srgb,var(--c) 62%,transparent)}
  .seg:hover em{color:#fff;font-size:10.5px;
    text-shadow:0 0 14px var(--c),0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
  .seg:hover i{opacity:1;box-shadow:0 0 26px 1px var(--c)}
  .seg:hover .dati u{opacity:.95}
  .seg:hover .sigillo{
    opacity:1;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c) 75%,transparent))}
}
.seg:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

@media (max-width:760px){
  /* su schermo stretto le epoche scorrono lateralmente e gli anni restano visibili */
  .ribbon-track{overflow-x:auto;scrollbar-width:none;
    margin:0 -15px;padding:6px 15px;scroll-snap-type:x proximity;
    scroll-padding-left:15px}
  .ribbon-track::-webkit-scrollbar{display:none}
  /* riduzione uniforme del 5% dei pulsanti delle epoche */
  .seg{
    flex:0 0 auto;width:120px;scroll-snap-align:start;
    gap:calc(8.55px*(1 - var(--p)));
    padding:calc(10.45px*(1 - var(--p)) + 5.7px*var(--p)) 11.4px
      calc(11.4px*(1 - var(--p)) + 5.7px*var(--p));
    border-radius:9.5px
  }
  .sigillo{
    width:calc(43.7px - 19px*var(--p));height:calc(43.7px - 19px*var(--p));
    margin:calc(.95px*(1 - var(--p))) 0 calc(2.85px*(1 - var(--p)))
  }
  .sigillo img{
    pointer-events:none;user-select:none;-webkit-user-select:none;
    -webkit-user-drag:none;-webkit-touch-callout:none
  }
  .seg i{height:calc(2.85px*(1 - var(--p)))}
  .seg em{font-size:11.6px}
  .dati{padding-top:calc(6.65px*(1 - var(--p)));gap:2.85px;
    max-height:calc(45.6px*(1 - var(--p)));font-size:11.4px}
  .dati u{opacity:.9}
  /* feedback tattile: visibile solo durante il tocco, senza hover persistente */
  .seg:active,.seg.mobile-pressed{
    transform:scale(.97);z-index:2;
    border-color:color-mix(in srgb,var(--c) 84%,#fff 8%);
    box-shadow:0 0 13px color-mix(in srgb,var(--c) 36%,transparent),
      inset 0 0 12px color-mix(in srgb,var(--c) 20%,transparent)
  }
  .seg:active .sigillo,.seg.mobile-pressed .sigillo{
    opacity:1;
    filter:drop-shadow(0 0 11px color-mix(in srgb,var(--c) 78%,transparent))
  }
  .seg:active i,.seg.mobile-pressed i{
    opacity:1;box-shadow:0 0 16px color-mix(in srgb,var(--c) 65%,transparent)
  }
}

/* ============================== ricerca ================================ */
.controls{
  position:sticky;top:calc(var(--ribbon-h,48px) + var(--ribbon-gap));z-index:30;margin:4px 0 0;padding:13px 0;
  will-change:transform;transform:translateZ(0);
}
/* sfondo a piena larghezza dello SCHERMO (non solo della colonna di
   contenuto, che su schermi larghi e' piu' stretta del viewport e
   lascerebbe due strisce vuote ai lati): la tecnica dei 50vw "sfonda"
   fuori da .wrap indipendentemente da quanto e' largo lo schermo */
.controls::before{content:"";position:absolute;top:0;bottom:0;left:50%;
  width:100vw;margin-left:-50vw;
  background:rgba(3,5,11,.97);
  border-bottom:1px solid var(--line);z-index:-1}
.search-wrap{position:relative}
.filters-wrap{min-width:0}
.mobile-control-switches,.mobile-panel-close{display:none}
.search{
  width:100%;background:rgba(10,16,27,.85);border:1px solid var(--line);
  color:var(--ink);font-family:var(--body);font-size:15.5px;padding:10px 13px;
  border-radius:9px;
}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:none;border-color:var(--line-strong);
  box-shadow:0 0 0 3px rgba(148,178,206,.09)}
.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding:1px 0 2px;
  scrollbar-width:none;overscroll-behavior-x:contain}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex:0 0 auto;border:1px solid var(--line);border-radius:6px;
  padding:5px 9px;background:rgba(9,14,24,.68);color:var(--ink-faint);
  font-family:var(--display);font-size:11.5px;font-weight:600;line-height:1.15;
  letter-spacing:.035em;cursor:pointer;touch-action:manipulation;
  transition:color .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease,opacity .18s ease}
.filter-btn[aria-pressed="true"]{color:var(--ink);border-color:var(--line-strong);
  background:rgba(148,178,206,.16);
  box-shadow:0 0 11px rgba(148,178,206,.13),inset 0 0 8px rgba(148,178,206,.05)}
.filter-btn[aria-pressed="false"]{opacity:.46;background:rgba(3,5,11,.5)}
.filter-btn:hover,.filter-btn:focus-visible{border-color:#7890A8;color:var(--ink)}
.filter-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tally{font-family:var(--display);font-size:14px;color:var(--ink-faint);
  padding-top:9px;letter-spacing:.02em;min-height:19px}
.tally:empty{padding-top:0;min-height:0}

/* ============================== gruppi ================================= */
.group{margin-top:38px;contain:layout style}
/* solo la prima epoca: a riposo (pagina non ancora scorsa) deve gia'
   trovarsi vicina alla barra sopra, alla stessa distanza che si crea
   piu' in basso una volta agganciata sotto il nastro/barra di ricerca */
.group:first-child{margin-top:0}
.group-head{position:sticky;top:var(--bar-h);z-index:20;padding:12px 0 26px;
  will-change:transform;transform:translateZ(0)}
/* sfondo a piena larghezza dello schermo (stessa tecnica di .controls),
   esteso ben oltre il testo (bottom negativo) cosi' la dissolvenza verso
   lo sfondo stellato e' graduale invece che tagliata di netto appena
   sotto al titolo */
.group-head::before{content:"";position:absolute;top:0;left:50%;bottom:-55px;
  width:100vw;margin-left:-50vw;z-index:-1;
  background:linear-gradient(to bottom,
    rgba(3,5,11,1) 0%,rgba(3,5,11,1) 60%,
    rgba(3,5,11,.86) 66%,rgba(3,5,11,.68) 72%,
    rgba(3,5,11,.5) 78%,rgba(3,5,11,.35) 84%,
    rgba(3,5,11,.22) 89%,rgba(3,5,11,.12) 94%,
    rgba(3,5,11,.04) 98%,rgba(3,5,11,0) 100%)}
/* dissolvenza in ALTO, indipendente da quella sotto (che restava gia'
   bene com'era): sfuma dal nulla fino allo stesso nero con cui parte
   ::before, cosi' si uniscono senza soluzione di continuita' */
.group-head::after{content:"";position:absolute;top:-76px;left:50%;height:76px;
  width:100vw;margin-left:-50vw;z-index:-1;
  background:linear-gradient(to bottom,rgba(3,5,11,0) 0%,rgba(3,5,11,1) 100%)}
.group-head h2{font-family:var(--display);font-weight:700;font-size:32.4px;
  letter-spacing:-.005em;margin:0;display:flex;align-items:center;gap:13.5px;
  justify-content:center}
.g-sigillo{width:36.9px;height:36.9px;flex:0 0 auto;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 55%,transparent))}
.g-sigillo:not(.vuoto){background-color:var(--c);
  -webkit-mask:var(--sig) center/contain no-repeat;
          mask:var(--sig) center/contain no-repeat}
.g-sigillo:not(.vuoto) img{width:100%;height:100%;opacity:0}
.g-sigillo.vuoto{width:19px;height:19px;align-self:center;
  border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:50%}
.g-sigillo.vuoto img{display:none}
.group-head .g-date{display:block;text-align:center;color:var(--ink-faint);
  font-family:var(--display);font-size:18.7px;font-variant-numeric:tabular-nums}

/* =============================== voci ================================== */
.items{list-style:none;margin:0;padding:28px 0 0;position:relative;
  display:flex;flex-direction:column;gap:26px}
.items::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  transform:translateX(-.5px);
  background:linear-gradient(to bottom,transparent,var(--line-strong) 5%,
             var(--line-strong) 95%,transparent)}
.item{position:relative;width:calc(50% - 46px);contain:layout style}
.item.dx{margin-left:auto}
/* raccordo orizzontale verso la linea centrale */
.item::after{content:"";position:absolute;top:36px;width:46px;height:1px;
  background:var(--line-strong)}
.item.sx::after{right:-46px}
.item.dx::after{left:-46px}
/* nodo appoggiato sulla linea centrale */
.item::before{content:"";position:absolute;top:31px;width:10px;height:10px;
  border-radius:50%;background:var(--c);box-shadow:0 0 12px -1px var(--c)}
.item.sx::before{right:-51px}
.item.dx::before{left:-51px}
.item.legends::before{background:var(--bg);border:1.5px solid var(--ink-faint);box-shadow:none}
.head{width:100%;text-align:left;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(6px);
  padding:14px;display:flex;gap:14px;align-items:flex-start}
.item.sx .head{flex-direction:row-reverse}
.item.sx .txt{text-align:right}
.item.sx .meta{justify-content:flex-end}
.txt{min-width:0;flex:1 1 auto}
.yr{font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--c);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;display:block}
.item.legends .yr{color:var(--ink-faint)}
.title{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15;
  margin:2px 0 6px;display:block}
.stagioni{display:block;margin:-1px 0 7px;color:color-mix(in srgb,var(--c) 62%,#C9D6E5 38%);
  font-family:var(--display);font-size:12px;font-weight:600;line-height:1.2;
  letter-spacing:.055em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;font-size:13.5px;color:var(--ink-dim);line-height:1.3}
.item:is(.film,.serie,.corto,.gioco) .meta{margin-top:4px}
.meta span{padding:0 9px}
.meta span:first-child{padding-left:0}
.meta span+span{border-left:1px solid var(--line-strong)}

/* --------- riquadro immagine: file dentro la cartella immagini/ --------- */
.shot{margin:0;flex:0 0 auto;width:106px;aspect-ratio:2/3;overflow:hidden;border-radius:7px;
  background:var(--panel-solid);border:1px solid var(--line);position:relative}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot[data-tipo="Audiolibro"]{aspect-ratio:1/1}
.shot.vuoto::before{content:"";position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(135deg,transparent 0 7px,var(--c) 7px 8px);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000);
  mask-image:linear-gradient(to bottom,transparent,#000)}
.shot.vuoto::after{content:attr(data-tipo);position:absolute;inset:auto 0 6px;
  text-align:center;font-family:var(--display);font-size:11.5px;color:var(--ink-faint)}

/* ------------------- film: la spina dorsale della saga ------------------ */
.item.film{width:min(720px,100%);margin:14px auto;align-self:center}
.item.film::after{display:none}
.item.film::before{left:50%;right:auto;top:-9px;width:17px;height:17px;
  transform:translateX(-50%);background:var(--bg);border:3px solid var(--c);
  box-shadow:0 0 24px -1px var(--c)}
.item.film .head{flex-direction:column;gap:0;padding:0;overflow:hidden;
  border-color:color-mix(in srgb,var(--c) 40%,transparent);
  background:linear-gradient(to bottom,rgba(9,14,24,.6),
             color-mix(in srgb,var(--c) 15%,rgba(9,14,24,.88)))}
.item.film .head:hover{border-color:color-mix(in srgb,var(--c) 68%,transparent)}
.item.film .shot{width:100%;aspect-ratio:16/9;border:0;border-radius:0;
  border-bottom:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.item.film .txt{width:100%;padding:16px 20px 19px;text-align:center}
.item.film .title{font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.06}
.item.film .yr{font-size:15.5px}
.item.film .meta{justify-content:center;color:#A9BDD1}

/* --------- serie (live-action o animate): al centro come i film, ma
   piu' piccole, per mettere in luce la gerarchia (film > serie > resto).
   L'immagine sta di lato al testo (come le voci normali), non sopra --------- */
.item.serie{width:min(500px,100%);margin:10px auto;align-self:center}
.item.serie::after{display:none}
.item.serie::before{left:50%;right:auto;top:-7px;width:14px;height:14px;
  transform:translateX(-50%);background:var(--bg);border:2px solid var(--c);
  box-shadow:0 0 16px -1px var(--c)}
.item.serie .head{border-color:color-mix(in srgb,var(--c) 32%,transparent);
  background:linear-gradient(to bottom,rgba(9,14,24,.6),
             color-mix(in srgb,var(--c) 9%,rgba(9,14,24,.88)))}
.item.serie .head:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.item.serie .shot{width:145px}
.item.serie .title{font-size:18.7px;font-weight:700;letter-spacing:-.005em;line-height:1.12}
.item.serie .yr{font-size:13.75px}

/* ---------------- corti: sotto le serie, sopra i videogiochi ----------- */
.item.corto{width:min(400px,100%);margin:8px auto;align-self:center}
.item.corto::after{display:none}
.item.corto::before{left:50%;right:auto;top:-6px;width:12px;height:12px;
  transform:translateX(-50%);background:var(--bg);border:1.75px solid var(--c);
  box-shadow:0 0 14px -1px var(--c)}
.item.corto .head{border-color:color-mix(in srgb,var(--c) 26%,transparent);
  background:linear-gradient(to bottom,rgba(9,14,24,.6),
             color-mix(in srgb,var(--c) 7%,rgba(9,14,24,.88)))}
.item.corto .head:hover{border-color:color-mix(in srgb,var(--c) 52%,transparent)}
.item.corto .shot{width:118px}
.item.corto .title{font-size:17.3px;font-weight:700;letter-spacing:-.003em;line-height:1.12}
.item.corto .yr{font-size:12.5px}

/* ------ videogiochi: ultimo gradino della gerarchia centrale
   ("film > serie > corto > gioco") ------ */
.item.gioco{width:min(340px,100%);margin:8px auto;align-self:center}
.item.gioco::after{display:none}
.item.gioco::before{left:50%;right:auto;top:-6px;width:11px;height:11px;
  transform:translateX(-50%);background:var(--bg);border:1.5px solid var(--c);
  box-shadow:0 0 13px -1px var(--c)}
.item.gioco .head{flex-direction:column;gap:0;padding:0;overflow:hidden;
  border-color:color-mix(in srgb,var(--c) 28%,transparent);
  background:linear-gradient(to bottom,rgba(9,14,24,.6),
             color-mix(in srgb,var(--c) 7%,rgba(9,14,24,.88)))}
.item.gioco .head:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.item.gioco .shot{width:100%;aspect-ratio:16/9;border:0;border-radius:0;
  border-bottom:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.item.gioco .txt{width:100%;padding:9px 13px 10px;text-align:center}
.item.gioco .title{font-size:14.5px;font-weight:700;letter-spacing:-.005em;line-height:1.15}
.item.gioco .yr{font-size:11px}
.item.gioco .meta{justify-content:center;color:#A9BDD1}

/* =============== linguaggio visivo della gerarchia ==================== */
/* Film: cornice doppia, luce piu' presente e nodo a doppio anello. */
.item.film .head{
  border-color:color-mix(in srgb,var(--c) 58%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 28%,transparent),
             0 0 46px -14px color-mix(in srgb,var(--c) 88%,transparent),
             0 0 72px -34px color-mix(in srgb,var(--c) 74%,transparent),
             inset 0 0 38px color-mix(in srgb,var(--c) 13%,transparent)
}
.item.film .head:hover{border-color:color-mix(in srgb,var(--c) 86%,transparent)}
.item.film::before{
  outline:1px solid color-mix(in srgb,var(--c) 74%,transparent);outline-offset:3px;
  box-shadow:0 0 30px 3px color-mix(in srgb,var(--c) 52%,transparent)
}
.item.film .title{text-shadow:0 0 20px color-mix(in srgb,var(--c) 52%,transparent)}

/* Serie TV: cornice continua e barra laterale, come un capitolo lungo. */
.item.serie .head{
  border-style:solid;
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--c) 62%,transparent)
}
.item.serie::before{background:color-mix(in srgb,var(--c) 34%,var(--bg))}

/* Corti: cornice tratteggiata, immagine leggermente piu' sobria e nodo
   a rombo, leggibile anche quando la timeline e' molto compatta. */
.item.corto .head{border-style:dashed;box-shadow:none}
.item.corto::before{border-radius:2px;transform:translateX(-50%) rotate(45deg)}
.item.corto .shot img{filter:saturate(.78) contrast(1.05)}

/* Videogiochi: angoli tecnici, trama HUD appena visibile e nodo esagonale. */
.item.gioco .head{
  border-radius:2px;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,
    100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);
  background:
    repeating-linear-gradient(0deg,transparent 0 15px,
      color-mix(in srgb,var(--c) 5%,transparent) 15px 16px),
    linear-gradient(to bottom,rgba(9,14,24,.68),
      color-mix(in srgb,var(--c) 8%,rgba(9,14,24,.9)))
}
.item.gioco::before{
  border:0;border-radius:0;background:var(--c);
  clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)
}
.item.gioco .shot:not(.vuoto)::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 5px,
    rgba(210,230,255,.035) 5px 6px)
}

/* Badge: stessa tinta dell'epoca, forma diversa per ciascun livello. */
.item.film .meta span:first-child,
.item.serie .meta span:first-child,
.item.corto .meta span:first-child,
.item.gioco .meta span:first-child{
  color:var(--c);font-family:var(--display);font-weight:600;
  letter-spacing:.065em;text-transform:uppercase;margin-right:8px;padding:1px 7px
}
.item.film .meta span:first-child{
  border-top:1px solid color-mix(in srgb,var(--c) 65%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--c) 65%,transparent);
  background:color-mix(in srgb,var(--c) 7%,transparent)
}
.item.serie .meta span:first-child{
  border:1px solid color-mix(in srgb,var(--c) 46%,transparent);border-radius:999px;
  background:color-mix(in srgb,var(--c) 8%,transparent)
}
.item.corto .meta span:first-child{
  border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);border-radius:2px
}
.item.gioco .meta span:first-child{
  border:1px solid color-mix(in srgb,var(--c) 42%,transparent);border-radius:0;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  background:color-mix(in srgb,var(--c) 9%,transparent)
}

/* Nei livelli intermedi il titolo resta il primo elemento da leggere;
   categoria e pubblicazione conservano la forma, ma arretrano di tono. */
.item:is(.serie,.corto,.gioco) .title{
  color:#F1F6FD;font-weight:700;
  text-shadow:0 0 13px rgba(226,234,244,.16)
}
.item.serie .title{font-size:23px}
.item.corto .title{font-size:20.5px}
.item.gioco .title{font-size:18.5px}
.item:is(.serie,.corto,.gioco) .meta{font-size:11.5px;opacity:.7}
.item:is(.serie,.corto,.gioco) .meta span:first-child{
  padding:1px 6px;margin-right:6px;letter-spacing:.045em
}

/* Etichette delle opere editoriali: solo tipografia, senza badge o
   modifiche ai riquadri. La tinta dell'epoca resta discreta ma leggibile. */
.item:is([data-opera-tipo="romanzo"],[data-opera-tipo="fumetto"],
  [data-opera-tipo="manga"],[data-opera-tipo="audiolibro"]) .title{
  color:#EDF4FC;font-size:20.96px;font-weight:600;line-height:1.12;
  text-shadow:0 0 11px rgba(226,234,244,.12)
}
.item:is([data-opera-tipo="romanzo"],[data-opera-tipo="fumetto"],
  [data-opera-tipo="manga"],[data-opera-tipo="audiolibro"]) .yr{
  font-size:14.14px
}
.item:is([data-opera-tipo="romanzo"],[data-opera-tipo="fumetto"],
  [data-opera-tipo="manga"],[data-opera-tipo="audiolibro"]) .meta{
  color:var(--ink-faint);font-size:11.21px;opacity:.7
}
.item:is([data-opera-tipo="romanzo"],[data-opera-tipo="fumetto"],
  [data-opera-tipo="manga"],[data-opera-tipo="audiolibro"]) .meta span:first-child{
  color:color-mix(in srgb,var(--c) 58%,var(--ink-dim));text-transform:uppercase
}
.item[data-opera-tipo="romanzo"] .meta span:first-child{
  font-family:var(--body);font-weight:600;letter-spacing:.08em;
  font-variant-caps:normal
}
.item[data-opera-tipo="fumetto"] .meta span:first-child{
  font-family:var(--display);font-weight:700;letter-spacing:.055em
}
.item[data-opera-tipo="manga"] .meta span:first-child{
  font-family:var(--display);font-weight:500;letter-spacing:.18em
}
.item[data-opera-tipo="audiolibro"] .meta span:first-child{
  font-family:var(--body);font-weight:500;font-style:italic;letter-spacing:.055em
}

/* Le schede con approfondimenti aprono un pannello dedicato senza cambiare
   la gerarchia o il comportamento delle altre opere. */
.item:is(.has-episode-guide,.has-comic-guide) .head{position:relative;cursor:pointer;font:inherit;
  appearance:none;-webkit-appearance:none;
  transition:border-color .22s ease,box-shadow .22s ease,transform .18s ease}
.item:is(.has-episode-guide,.has-comic-guide) .head:active{transform:scale(.996)}
.item:is(.has-episode-guide,.has-comic-guide) .head:focus-visible{outline:2px solid var(--c);outline-offset:4px}
.episode-expand{position:absolute;right:14px;bottom:14px;z-index:3;
  width:30px;height:30px;border:1px solid color-mix(in srgb,var(--c) 72%,transparent);
  border-radius:8px;background:rgba(3,5,11,.9);color:var(--c);
  box-shadow:0 0 13px color-mix(in srgb,var(--c) 20%,transparent);
  transition:border-color .22s ease,box-shadow .22s ease,transform .28s ease}
.episode-expand::before,.episode-expand::after{content:"";position:absolute;
  left:50%;top:50%;width:11px;height:2px;border-radius:2px;background:currentColor;
  transform:translate(-50%,-50%);transition:transform .28s ease,opacity .2s ease}
.episode-expand::after{transform:translate(-50%,-50%) rotate(90deg)}
.item.has-comic-guide .episode-expand{
  right:10px;bottom:10px;width:22px;height:22px;border-radius:6px
}
.item.has-comic-guide .episode-expand::before,
.item.has-comic-guide .episode-expand::after{width:8px;height:1.5px}
.item:is(.episode-guide-open,.comic-guide-open) .episode-expand{border-color:var(--c);
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 34%,transparent);transform:rotate(180deg)}
.item:is(.episode-guide-open,.comic-guide-open) .episode-expand::after{opacity:0;
  transform:translate(-50%,-50%) rotate(90deg) scaleY(0)}
.episode-guide{display:grid;grid-template-rows:0fr;opacity:0;
  transform:translateY(-9px);pointer-events:none;
  transition:grid-template-rows .42s cubic-bezier(.22,.8,.25,1),
    opacity .24s ease,transform .38s cubic-bezier(.22,.8,.25,1)}
.item.episode-guide-open .episode-guide{grid-template-rows:1fr;opacity:1;
  transform:translateY(0);pointer-events:auto}
.episode-guide-clip{min-height:0;overflow:hidden}
.episode-guide-card{margin-top:10px;border:1px solid color-mix(in srgb,var(--c) 38%,transparent);
  border-radius:var(--r);overflow:hidden;background:rgba(7,12,21,.96);
  box-shadow:0 16px 34px rgba(0,0,0,.3),0 0 26px color-mix(in srgb,var(--c) 8%,transparent)}
.episode-guide-head{padding:16px 18px 13px;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,rgba(9,14,24,.96)),rgba(9,14,24,.96))}
.episode-guide-head strong{display:block;font-family:var(--display);font-size:20px;
  line-height:1.1;color:var(--ink)}
.episode-guide-scroll{max-height:min(64vh,610px);overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-color:var(--c) transparent}
.episode-list{list-style:none;margin:0;padding:5px 10px 10px}
.episode-row{display:grid;grid-template-columns:38px 62px minmax(0,1fr);align-items:center;
  gap:9px;min-height:39px;padding:7px 8px;border-bottom:1px solid rgba(148,178,206,.09)}
.episode-row:last-child{border-bottom:0}
.episode-order{font-family:var(--display);font-size:11px;color:var(--ink-faint);
  text-align:right;font-variant-numeric:tabular-nums}
.episode-code{justify-self:start;padding:2px 6px;border:1px solid color-mix(in srgb,var(--c) 34%,transparent);
  border-radius:4px;color:var(--c);font-family:var(--display);font-size:11px;
  font-weight:700;letter-spacing:.045em;white-space:nowrap}
.episode-name{min-width:0;font-size:13.5px;font-weight:500;line-height:1.25;color:#CED9E6}
.episode-row.is-film{margin:4px 0;border:1px solid color-mix(in srgb,var(--c) 46%,transparent);
  border-radius:7px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.episode-row.is-film .episode-order,.episode-row.is-film .episode-name{color:var(--ink);font-weight:700}
.episode-row.is-film .episode-code{background:var(--c);border-color:var(--c);color:#06101E}

/* Elenco dei numeri originali inclusi in ciascuna raccolta a fumetti. */
.comic-guide{display:grid;grid-template-rows:0fr;opacity:0;
  transform:translateY(-8px);pointer-events:none;
  transition:grid-template-rows .38s cubic-bezier(.22,.8,.25,1),
    opacity .22s ease,transform .34s cubic-bezier(.22,.8,.25,1)}
.item.comic-guide-open .comic-guide{grid-template-rows:1fr;opacity:1;
  transform:translateY(0);pointer-events:auto}
.comic-guide-clip{min-height:0;overflow:hidden}
.comic-guide-card{margin-top:8px;padding:12px 14px 13px;
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);
  border-radius:var(--r);background:rgba(7,12,21,.96);
  box-shadow:0 12px 28px rgba(0,0,0,.26),0 0 22px color-mix(in srgb,var(--c) 7%,transparent)}
.comic-guide-title{display:block;margin:0 0 8px;font-family:var(--display);
  font-size:14px;font-weight:750;line-height:1.15;color:var(--c);letter-spacing:.02em}
.comic-contents-list{list-style:none;margin:0;padding:0}
.comic-contents-list li{position:relative;padding:6px 6px 6px 17px;
  border-top:1px solid rgba(148,178,206,.09);color:#CED9E6;
  font-size:12.5px;font-weight:500;line-height:1.3}
.comic-contents-list li::before{content:"";position:absolute;left:3px;top:12px;
  width:5px;height:5px;border-radius:50%;background:var(--c);
  box-shadow:0 0 8px color-mix(in srgb,var(--c) 38%,transparent)}
.comic-collection-note{margin:10px 0 0;padding:9px 10px 8px;
  border-top:1px solid color-mix(in srgb,var(--c) 28%,transparent);
  background:color-mix(in srgb,var(--c) 6%,transparent);color:var(--ink-dim)}
.comic-collection-note span{display:block;margin-bottom:3px;font-family:var(--display);
  font-size:9.5px;font-weight:650;letter-spacing:.075em;text-transform:uppercase;
  color:color-mix(in srgb,var(--c) 72%,var(--ink-dim))}
.comic-collection-note strong{display:block;font-size:12px;font-weight:650;
  line-height:1.3;color:#D3DEEA}
.mobile-expand{display:none}
.back-top{
  position:fixed;z-index:45;right:24px;bottom:24px;width:48px;height:48px;
  display:grid;place-items:center;padding:0;border-radius:50%;cursor:pointer;
  border:1px solid rgba(148,178,206,.42);color:#C9DAEC;
  background:rgba(7,12,21,.9);backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(0,0,0,.34),0 0 18px rgba(120,160,205,.1);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(10px) scale(.9);
  transition:opacity .2s ease,visibility .2s ease,transform .2s ease,
    border-color .2s ease,box-shadow .2s ease
}
.back-top.visibile{opacity:1;visibility:visible;pointer-events:auto;
  transform:translateY(0) scale(1)}
.back-top:hover,.back-top:focus-visible{border-color:#AFC8E0;
  box-shadow:0 8px 25px rgba(0,0,0,.34),0 0 22px rgba(150,190,230,.25)}
.back-top:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.back-top span{position:relative;display:block;width:18px;height:20px;transform:translate(-1.5px,2px)}
.back-top span::before,.back-top span::after{
  content:"";position:absolute;left:4.5px;width:9px;height:9px;
  border-top:2px solid currentColor;border-left:2px solid currentColor;
  transform:rotate(45deg)
}
.back-top span::before{top:1px}
.back-top span::after{top:9px}
.jump-transition{display:none}
.jump-line-fade{display:none}
.jump-header-snapshot{display:none}
@media (max-width:700px){
  /* Nei salti molto lunghi il webview non deve ridisegnare tutta la timeline.
     Questa velatura riproduce la linea e le schede in rapido movimento: il
     trasferimento nascosto sembra cosi' la continuazione dello scroll vero. */
  .jump-transition{
    --timeline-side-pad:20px;
    --timeline-x:calc(var(--timeline-side-pad) + 14px);
    display:block;position:fixed;z-index:25;overflow:hidden;
    top:var(--bar-h,0px);right:0;bottom:0;left:0;
    opacity:0;visibility:hidden;pointer-events:none;contain:strict;isolation:isolate;
    /* Il fondale dell'overlay e' realmente opaco: con valori al 95% i
       riquadri veri rimanevano leggibili sotto quelli simulati, producendo
       la doppia immagine visibile nei salti tra epoche. Le tre trame minute
       mantengono invece continuita' con il cielo senza aggiungere elementi. */
    background-image:
      radial-gradient(circle at 23px 31px,rgba(242,247,255,.34) 0 .65px,transparent .95px),
      radial-gradient(circle at 91px 137px,rgba(193,216,250,.24) 0 .7px,transparent 1px),
      radial-gradient(circle at 211px 83px,rgba(255,237,207,.19) 0 .75px,transparent 1.1px),
      linear-gradient(90deg,#020409 0 14%,#050910 28%,#060B13 74%,#020409 100%);
    background-size:173px 211px,257px 331px,389px 487px,auto;
    background-position:0 0,37px 59px,83px 127px,0 0;
    background-repeat:repeat,repeat,repeat,no-repeat;
    transition:opacity .22s ease,visibility 0s linear .22s
  }
  .jump-transition::before{
    content:"";position:absolute;top:-116px;bottom:-116px;
    left:calc(var(--timeline-x) - 10px);width:20px;opacity:0;
    background:
      radial-gradient(circle,rgba(151,169,190,.68) 0 2.5px,
        rgba(119,139,161,.28) 3.5px,transparent 5.5px) center 18px/20px 116px repeat-y,
      linear-gradient(to right,transparent 9px,rgba(133,153,176,.32) 9px 11px,
        transparent 11px) center/20px 100% no-repeat;
    filter:blur(.35px);transform:translate3d(0,0,0);
    transition:opacity .11s ease
  }
  .jump-transition::after{
    content:"";position:absolute;top:-116px;
    right:calc(var(--timeline-side-pad) + 10vw);bottom:-116px;
    left:calc(var(--timeline-x) + 26px);opacity:0;
    border-radius:8px;
    background:repeating-linear-gradient(to bottom,
      transparent 0 13px,
      rgba(81,111,146,.05) 14px 23px,
      rgba(107,137,171,.12) 24px 74px,
      rgba(147,177,211,.22) 75px 76px,
      rgba(24,39,58,.08) 77px 84px,
      transparent 85px 116px);
    filter:blur(2.2px);transform:translate3d(0,0,0);
    transition:opacity .11s ease
  }
  .jump-transition.is-visible{
    opacity:1;visibility:visible;pointer-events:auto;
    transition:opacity .22s ease,visibility 0s
  }
  .jump-transition.is-visible::before{
    opacity:.64;animation:timelineRushDown .72s linear both
  }
  .jump-transition.is-visible::after{
    opacity:.9;animation:timelineRushDown .72s linear both
  }
  .jump-transition.is-visible.verso-alto::before,
  .jump-transition.is-visible.verso-alto::after{animation-name:timelineRushUp}
  /* La linea continua a muoversi, mentre queste due velature restano ferme:
     punti e tratto verticale nascono e scompaiono dolcemente ai bordi. */
  .jump-line-fade{
    display:block;position:absolute;z-index:1;top:0;bottom:0;
    left:calc(var(--timeline-x) - 13px);width:26px;pointer-events:none
  }
  .jump-line-fade::before,.jump-line-fade::after{
    content:"";position:absolute;left:0;width:100%;height:min(18vh,120px)
  }
  .jump-line-fade::before{
    top:0;background:linear-gradient(to bottom,#020409 0%,rgba(2,4,9,.94) 24%,transparent 100%)
  }
  .jump-line-fade::after{
    bottom:0;background:linear-gradient(to top,#020409 0%,rgba(2,4,9,.94) 24%,transparent 100%)
  }
  .jump-transition.is-exiting{
    opacity:0;pointer-events:none;
    transition:opacity .26s cubic-bezier(.22,.72,.24,1),visibility 0s linear .26s
  }
  /* Nei WebView iOS un elemento sticky puo' saltare un fotogramma quando
     sotto di lui avviene il trasferimento istantaneo della pagina. Durante
     il solo tratto simulato mostriamo una copia visiva gia' composta del
     nastro e dei comandi: occupa gli stessi pixel, non e' interattiva e
     viene rimossa prima che torni visibile lo scorrimento reale. */
  .jump-header-snapshot{
    display:block;position:fixed;z-index:44;top:0;right:0;left:0;height:0;
    overflow:hidden;visibility:hidden;opacity:0;pointer-events:none;
    contain:layout paint style;isolation:isolate;background:#03050B;
    transform:translateZ(0);backface-visibility:hidden
  }
  .jump-header-snapshot.is-visible{visibility:visible;opacity:1}
  .jump-header-snapshot > .ribbon,
  .jump-header-snapshot > .controls{
    position:absolute!important;margin:0!important;transform:translateZ(0)
  }
  .jump-header-snapshot .ribbon-track{overscroll-behavior:none}
  /* La parte centrale resta rapida, ma l'ultimo quarto percorre pochi pixel:
     la sagoma arriva allo scroll reale gia' visibilmente rallentata. */
  @keyframes timelineRushDown{
    0%{transform:translate3d(0,0,0)}
    18%{transform:translate3d(0,-8px,0)}
    40%{transform:translate3d(0,-58px,0)}
    55%{transform:translate3d(0,-83px,0)}
    70%{transform:translate3d(0,-100px,0)}
    82%{transform:translate3d(0,-109px,0)}
    92%{transform:translate3d(0,-113px,0)}
    100%{transform:translate3d(0,-116px,0)}
  }
  @keyframes timelineRushUp{
    0%{transform:translate3d(0,0,0)}
    18%{transform:translate3d(0,8px,0)}
    40%{transform:translate3d(0,58px,0)}
    55%{transform:translate3d(0,83px,0)}
    70%{transform:translate3d(0,100px,0)}
    82%{transform:translate3d(0,109px,0)}
    92%{transform:translate3d(0,113px,0)}
    100%{transform:translate3d(0,116px,0)}
  }
}

/* sotto i 700px la linea si sposta a sinistra: una colonna sola */
@media (max-width:700px){
  /* Se un browser mobile sospende per un istante i livelli fixed durante
     uno scroll molto rapido, affiora un fondale blu-notte invece del nero. */
  html,body{background-color:#050914}
  body{position:relative;isolation:isolate}
  body::before{content:none}
  /* 100lvh usa l'altezza massima stabile del webview: l'apertura della
     barra di Telegram non lascia scoperto il bordo del campo stellare. */
  @supports (height:100lvh){
    #stelle{height:100lvh;bottom:auto}
  }
  /* Telegram su iOS compone gli elementi fixed sotto la propria barra.
     La schermatura superiore e' divisa in una fascia sempre presente e in
     un'estensione di altezza FISSA che sfuma in entrata. Non la scaliamo:
     WebKit puo' conservare una texture sticky con dimensioni errate durante
     lo scroll inerziale, facendola scendere come una tendina nera. */
  .ribbon::before{
    top:calc(-1*var(--ribbon-gap) - 150px);
    bottom:auto;height:150px;
    opacity:var(--mobile-shield-p,0);
    pointer-events:none;will-change:opacity
  }
  .ribbon::after{
    content:"";position:absolute;top:calc(-1*var(--ribbon-gap));bottom:0;
    left:50%;width:100vw;margin-left:-50vw;z-index:-1;
    background:rgba(3,5,11,1)
  }
  /* Nello stato compatto l'intero blocco di navigazione perde un altro
     10%, senza modificare l'aspetto iniziale a pagina ferma. */
  .ribbon-track{
    padding:calc(6px - .6px*var(--p)) 15px;
    contain:layout style
  }
  .seg{
    width:calc(120px - 12px*var(--p));
    padding:calc(10.45px*(1 - var(--p)) + 5.13px*var(--p))
      calc(11.4px - 1.14px*var(--p))
      calc(11.4px*(1 - var(--p)) + 5.13px*var(--p));
    border-radius:calc(9.5px - .95px*var(--p));
    contain:layout style
  }
  .sigillo{
    width:calc(43.7px - 21.47px*var(--p));
    height:calc(43.7px - 21.47px*var(--p))
  }
  .controls{
    display:grid;grid-template-columns:max-content minmax(0,1fr);
    gap:calc(8px - .8px*var(--scroll-header-p));
    padding-top:10px;padding-bottom:10px
  }
  .mobile-control-switches{display:flex;grid-column:1/-1;
    gap:calc(8px - .8px*var(--scroll-header-p));min-width:0}
  .mobile-control-toggle,.mobile-panel-close{
    min-height:calc(40px - 4px*var(--scroll-header-p));
    border:1px solid var(--line);
    border-radius:calc(8px - .8px*var(--scroll-header-p));
    background:rgba(10,16,27,.88);color:var(--ink-dim);
    font-family:var(--display);
    font-size:calc(13px - 1.3px*var(--scroll-header-p));font-weight:600;
    letter-spacing:.04em;cursor:pointer;touch-action:manipulation
  }
  .mobile-control-toggle{
    padding:calc(8px - .8px*var(--scroll-header-p))
      calc(15px - 1.5px*var(--scroll-header-p))
  }
  #mobileSearchToggle,.jump-search-toggle{
    position:relative;display:grid;place-items:center;
    flex:0 0 calc(40px - 4px*var(--scroll-header-p));
    width:calc(40px - 4px*var(--scroll-header-p));padding:0
  }
  #mobileFiltersToggle,.jump-filters-toggle{position:relative}
  .search-toggle-icon{
    position:relative;width:14px;height:14px;border:1.8px solid currentColor;
    border-radius:50%;transform:translate(-2px,-2px)
  }
  .search-toggle-icon::after{
    content:"";position:absolute;width:7px;height:1.8px;right:-5.5px;bottom:-3px;
    border-radius:2px;background:currentColor;transform:rotate(45deg);
    transform-origin:center
  }
  .mobile-control-toggle:focus-visible,.mobile-panel-close:focus-visible{
    outline:2px solid var(--ink);outline-offset:2px
  }
  .controls.ha-ricerca :is(#mobileSearchToggle,.jump-search-toggle){
    color:var(--ink);border-color:var(--line-strong);
    box-shadow:inset 0 0 9px rgba(148,178,206,.08)
  }
  .controls.ha-ricerca :is(#mobileSearchToggle,.jump-search-toggle)::after{
    content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
    border-radius:50%;background:#9DC4E8;
    box-shadow:0 0 7px rgba(157,196,232,.75)
  }
  .controls.ha-filtri :is(#mobileFiltersToggle,.jump-filters-toggle){
    color:var(--ink);border-color:var(--line-strong);
    box-shadow:inset 0 0 9px rgba(148,178,206,.08)
  }
  .controls.ha-filtri :is(#mobileFiltersToggle,.jump-filters-toggle)::after{
    content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
    border-radius:50%;background:#9DC4E8;
    box-shadow:0 0 7px rgba(157,196,232,.75)
  }
  /* L'intestazione dell'epoca conserva la misura attuale all'inizio e si
     riduce progressivamente del 15% insieme all'header durante lo scroll. */
  .group-head{
    padding:calc(10.8px - 1.62px*var(--scroll-header-p)) 0
      calc(23.4px - 3.51px*var(--scroll-header-p));
    contain:layout style
  }
  .group-head h2{
    font-size:calc(27.7px - 4.155px*var(--scroll-header-p));
    gap:calc(12.2px - 1.83px*var(--scroll-header-p))
  }
  .g-sigillo{
    width:calc(33.2px - 4.98px*var(--scroll-header-p));

  .item[data-opera-tipo="romanzo"],

  /* Safari e i browser interni iOS pagano molto la combinazione di molti
     backdrop-filter e grandi forme sfocate fisse. Il fondale base contiene
     gia' le stesse velature cromatiche: su WebKit mobile evitiamo quindi i
     livelli duplicati e lasciamo i pannelli con la medesima trasparenza. */
  @supports (-webkit-touch-callout:none){
    /* Il livello opaco fixed era il responsabile della superficie nera che
       WebKit trascinava verso il basso durante l'inversione dello scroll.
       Su iPhone lo stesso cielo viene dipinto come fondale assoluto del
       documento: resta dietro alle schede, conserva colori e stelle, ma non
       puo' essere congelato insieme alle barre mobili di Safari/Telegram. */
    #sky{
      position:absolute;top:0;right:0;bottom:0;left:0;height:auto;
      min-height:100lvh;contain:paint;transform:none;backface-visibility:visible
    }
    /* Le intestazioni delle epoche sono sticky e hanno due sfumature nere
       a piena larghezza. Su WebKit la combinazione contain + layer GPU puo'
       conservare una superficie troppo alta durante l'inversione dello

       lasciarle nel normale flusso di composizione e dare alla sfumatura
       un'altezza esplicita evita il difetto senza cambiare il suo aspetto. */
    .group,.group-head{contain:none}
    .group-head{will-change:auto;transform:none}
    .group-head::before{bottom:auto;height:calc(100% + 55px)}
    .head,.top-panel,.controls::before,.back-top{
      -webkit-backdrop-filter:none!important;backdrop-filter:none!important
    }
    #sky .neb,#sky .banda,#sky .polvere,#sky .buio{display:none}
    .jump-transition::before,.jump-transition::after{filter:none}
    .jump-transition.is-visible::after{opacity:.78}
    .jump-header-snapshot > .ribbon,
    .jump-header-snapshot > .controls{will-change:auto}
  }

}

function raccoltaOneShot(titolo){
  if(RACCOLTE_ONE_SHOT_DIRETTE.has(titolo)) return RACCOLTE_ONE_SHOT_DIRETTE.get(titolo);
  const raccoltaEta = titolo.match(/^(L'Età della (?:Repubblica|Ribellione|Resistenza) – (?:Eroi|Nemici)):/);
  if(raccoltaEta) return raccoltaEta[1];
  if(titolo.startsWith("La Storia Segreta di Star Wars:")) return "La Storia Segreta di Star Wars";
  return "";
}

const TIPO_LAB = {film:"Film",serie:"Serie TV",animazione:"Animazione",corto:"Corto",
                  romanzo:"Romanzo",fumetto:"Fumetto",gioco:"Videogioco",manga:"Manga",audiolibro:"Audiolibro"};

const TIPI_FILTRO = ["film","serie","corto","gioco","romanzo","fumetto","manga","audiolibro"];
const state = {q:"", tipi:new Set(TIPI_FILTRO)};

const guideFumettiAperte = new Set();
const vistaMobile = matchMedia("(max-width:700px)");
const SELETTORE_SCHEDE_MOBILI =
  '.item[data-opera-tipo="romanzo"],.item[data-opera-tipo="fumetto"],.item[data-opera-tipo="manga"],.item[data-opera-tipo="audiolibro"]';
const SCALA_SCHEDA_CHIUSA = .6;
const SCALA_SCHEDA_INGRANDITA = SCALA_SCHEDA_CHIUSA * 1.6;
OPERE.forEach((o,i)=>o.id = slug(o.ti)+"-"+i);
const OPERE_PER_ID = new Map(OPERE.map(o=>[o.id,o]));

function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,42)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function tipoGerarchico(o){
  if(o.t !== "animazione") return o.t;
  return /^Tales of the\b/i.test(o.ti) ? "corto" : "serie";
}
function etichettaTipo(o){return o.tipoLabel || TIPO_LAB[tipoGerarchico(o)] || TIPO_LAB[o.t]}

function gruppi(){
  const q = state.q.trim().toLowerCase();
  const items = OPERE
    .filter(o=>state.tipi.has(tipoGerarchico(o)))
    .filter(o=>!q || (o.ti+" "+o.n+" "+TIPO_LAB[o.t]+" "+etichettaTipo(o)).toLowerCase().includes(q))
    .sort((a,b)=>{
      if(a.y === null) return 1;
      if(b.y === null) return -1;
      /* a parita' di anno in-universo, l'ordine resta quello con cui le
         voci compaiono in OPERE (sort e' stabile): e' quell'ordine a
         dover rispecchiare la sequenza del sito di riferimento, non
         l'anno di uscita reale */
      return a.y - b.y;
    });
  return ERE.map(e=>({id:"epoca-"+e.id, chiave:e.id, simbolo:e.simbolo || e.id+".svg", label:e.nome, breve:e.breve, sub:e.span, c:e.c,
    items:items.filter(o=>o.e === e.id)})).filter(g=>g.items.length);
}

function aggiornaPulsantiFiltro(){
  filters.querySelectorAll("[data-filter]").forEach(btn=>
    btn.setAttribute("aria-pressed", String(state.tipi.has(btn.dataset.filter))));

/* Il lazy-loading nativo di Safari tende a richiedere molte copertine della
   timeline gia' all'avvio. Conservare l'URL in data-src ci permette invece
   di caricare soltanto le immagini vicine allo schermo. */
function caricaCopertina(im){
  if(!im?.dataset.src || im.dataset.loaded === "1") return;
  im.dataset.loaded = "1";
  im.src = im.dataset.src;
}
function scaricaCopertina(im){
  if(!im || im.dataset.loaded !== "1") return;
  delete im.dataset.loaded;
  im.removeAttribute("src");
}
function preparaCaricamentoCopertine(){
  if(ripresaCopertineTimer){
    clearTimeout(ripresaCopertineTimer);
    ripresaCopertineTimer = null;
  }
  osservatoreCopertine?.disconnect();
  osservatoreCopertine = null;
  statoCopertine.clear();
  const immagini = [...list.querySelectorAll("img[data-shot][data-src]")];
  if(!immagini.length) return;
  if(!("IntersectionObserver" in window)){
    immagini.forEach(caricaCopertina);
    return;
  }
  const osservatore = new IntersectionObserver(entries=>{
    if(osservatoreCopertine !== osservatore) return;
    entries.forEach(entry=>statoCopertine.set(entry.target,entry));
    if(sospendiCaricamentoCopertine) return;
    aggiornaCopertineOsservate(entries);
  },{rootMargin:vistaMobile.matches ? "900px 0px" : "1000px 0px",threshold:.01});
  osservatoreCopertine = osservatore;
  immagini.forEach(im=>osservatoreCopertine.observe(im));
}
function aggiornaCopertineOsservate(entries){
  for(const entry of entries){
    if(entry.isIntersecting){
      const visibileOra = entry.boundingClientRect.bottom >= -80
        && entry.boundingClientRect.top <= innerHeight+80;
      entry.target.setAttribute("fetchpriority",visibileOra ? "high" : "low");
      caricaCopertina(entry.target);
    }else{
      /* Conserviamo l'indirizzo in data-src, ma liberiamo bitmap e livello
         grafico delle copertine ormai lontane. Tornando indietro il file
         viene ripreso dalla cache, senza nuovo peso di rete. */
      scaricaCopertina(entry.target);
    }
  }
}
function programmaRipresaCopertine(){
  if(ripresaCopertineTimer) clearTimeout(ripresaCopertineTimer);
  /* L'osservatore resta agganciato anche durante il salto e conserva solo
     l'ultimo stato di ogni immagine. Riprendiamo le stesse richieste dopo
     l'arrivo, senza ricrearlo e registrare di nuovo l'intera timeline. */
  ripresaCopertineTimer = setTimeout(()=>{
    ripresaCopertineTimer = null;
    if(sospendiCaricamentoCopertine) return;
    osservatoreCopertine?.takeRecords().forEach(entry=>statoCopertine.set(entry.target,entry));
    /* Il rettangolo registrato all'ingresso nel margine puo' essere ormai
       vecchio. Rileggiamo solo le immagini vicine, prima delle scritture,
       per mantenere la priorita' alta delle copertine visibili all'arrivo. */
    const stati = [...statoCopertine.values()].map(entry=>entry.isIntersecting
      ? {target:entry.target,isIntersecting:true,boundingClientRect:entry.target.getBoundingClientRect()}
      : entry);
    aggiornaCopertineOsservate(stati);
  },120);
}
function precaricaCopertine(root,limite=8,dallaFine=false){
  if(!root) return;
  const immagini = [...root.querySelectorAll("img[data-shot][data-src]")];
  const selezione = dallaFine ? immagini.slice(-limite) : immagini.slice(0,limite);
  selezione.forEach((im,i)=>{
      im.setAttribute("fetchpriority",i < 4 ? "high" : "low");
      caricaCopertina(im);
    });
}

function render(){
  osservatoreCopertine?.disconnect();
  osservatoreCopertine = null;
  statoCopertine.clear();
  aggiornaPulsantiFiltro();
  const gs = gruppi();
  const tot = gs.reduce((n,g)=>n+g.items.length,0);
  const filtriAttivi = state.tipi.size !== TIPI_FILTRO.length;
  tally.textContent = state.q.trim() || filtriAttivi
    ? (tot ? tot + (state.q.trim()
      ? (tot===1?" opera trovata":" opere trovate")
      : (tot===1?" opera visibile":" opere visibili")) : "")
    : "";

  ribbon.innerHTML = gs.map(g=>
    `<button class="seg" style="--c:${g.c}"
      data-go="${g.id}" aria-label="${esc(g.label)}, ${g.items.length} ${g.items.length===1?"opera":"opere"}">
      <span class="sigillo${TINTA_SIMBOLI?"":" naturale"}" style="--sig:url('simboli/${g.simbolo}')"><img data-sig data-chiave="${g.chiave}" src="simboli/${g.simbolo}" alt="" draggable="false"></span>
      <i></i>
      <span class="dati"><em>${esc(g.breve)}</em><u>${esc(g.sub)}</u></span>
    </button>`).join("");

  if(!tot){
    if(osservatoreDimensioni) osservatoreDimensioni.disconnect();
    sezioniTimeline = [];
    segmentiRibbon = [];
    intestazioniEpoche = [];
    primaIntestazioneEpoca = null;
    metricheSezioni = [];
    osservatoreCopertine = null;
    list.innerHTML = state.tipi.size
      ? `<div class="empty"><b>Nessun risultato</b>
          Prova con una parola più corta o riattiva una tipologia.</div>`
      : `<div class="empty"><b>Nessuna tipologia visibile</b>
          Riattiva almeno uno dei filtri sopra.</div>`;
    misuraAltezzeNavigazione();
    aggiornaRibbon(true);
    return;
  }

  list.innerHTML = gs.map(g=>`
    <section class="group" id="${g.id}" style="--c:${g.c}">
      <div class="group-head"><h2>
        <span class="g-sigillo" style="--sig:url('simboli/${g.simbolo}')"><img data-sig data-chiave="${g.chiave}" src="simboli/${g.simbolo}" alt="" draggable="false"></span>
        ${esc(g.label)}</h2><span class="aurebesh" aria-hidden="true" translate="no">${esc(g.label)}</span><span class="g-date">${esc(g.sub)}</span></div>
      <ul class="items">${lista(g.items)}</ul>
    </section>`).join("");

  const agganciaSigilli = root => root.querySelectorAll("img[data-sig]").forEach(im=>{
    im.onerror = ()=>{
      if(!im.dataset.png){
        im.dataset.png = "1";
        im.parentElement.style.setProperty("--sig", `url('simboli/${im.dataset.chiave}.png')`);
        im.src = `simboli/${im.dataset.chiave}.png`;
      }else{
        im.parentElement.classList.add("vuoto"); im.remove();
      }
    };
  });
  agganciaSigilli(ribbon);
  agganciaSigilli(list);
  list.querySelectorAll("img[data-shot]").forEach(im=>{
    im.onerror = ()=>{im.parentElement.classList.add("vuoto"); im.remove();};
  });
  preparaCaricamentoCopertine();
  aggiornaIngombriSchede();
  spia(gs);
}

/* film, serie, corti e videogiochi restano centrati con dimensioni
   decrescenti; romanzi, fumetti, manga e audiolibri si alternano ai lati */
function lista(items){
  let n = 0;
  return items.map(o=>{
    const tipo = tipoGerarchico(o);
    const lato = tipo === "film" ? "film"
      : tipo === "serie" ? "serie"
      : tipo === "corto" ? "corto"
      : tipo === "gioco" ? "gioco"
      : (n++ % 2 ? "dx" : "sx");
    return voce(o, lato);
  }).join("");
}

function contenutoPannelloCloneWars(){

function pannelloCloneWars(o, aperto){

function contenutoPannelloFumetto(o){

function pannelloFumetto(o, aperto){
